# The Rails-on-Windows validation (tebako#330): press a freshly
# generated Rails application against the prebuilt windows-ucrt64 ruby
# runtime with the released tebako toolchain, boot the packaged
# executable, and prove the Rails stack loads inside it (the runner
# boots autoloaders, initializers, and the railties — the executable
# serving real Rails work).
#
# Scheduled nightly + manual dispatch — a Rails press is heavy; PR CI
# does not carry it. Nightly (tebako#753's closing turned this leg into
# the regression guard for the most defect-dense surface in the
# ecosystem — twelve layers came out of it; a week of blind spots was
# too long). The walkthrough the leg validates lives at
# docs/rails-packaging.md.
name: rails-windows
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      tools_run:
        description: 'ITERATION ONLY: a release-workflow run id whose bin-windows-ucrt64 artifact carries the tebako tool to press with (leave empty for the release-pinned verdict)'
        required: false
        type: string

concurrency:
  group: rails-windows
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  press-and-boot:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Generate the Rails application
        run: |
          gem install rails --no-document
          rails new myapp --skip-git --skip-docker --skip-jbuilder --skip-system-test --skip-bootsnap

      # The verdict path (the default, and every scheduled run): the
      # tools come from the pinned release, sha256-verified against the
      # release's own SHA256SUMS — a green leg here is a shippable
      # claim. The iteration path (a dispatch with tools_run set): the
      # tebako tool comes from that release-workflow run's staged
      # bin-windows-ucrt64 artifact — the bytes a release WOULD ship,
      # gated by the leg-complete marker (the build leg's own gates
      # passed), but not yet published. Iteration turns a
      # fix→release→verdict cycle into fix→run→verdict; the notice
      # banner marks the run as non-shippable evidence. The shim is
      # fetched release-pinned on both paths (the press only invokes
      # the tebako tool).
      - name: Fetch the pinned tebako tools (sha256-verified)
        if: inputs.tools_run == ''
        shell: bash
        run: |
          set -euo pipefail
          rel="v2.8.44"; ver="2.8.44"
          mkdir -p .tools && cd .tools
          base="https://github.com/tamatebako/tebako/releases/download/$rel"
          for a in "tebako-$ver-windows-ucrt64.exe" "tebako-shim-$ver-windows-ucrt64.exe" SHA256SUMS; do
            curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/$a"
          done
          grep "tebako-$ver-windows-ucrt64.exe\$" SHA256SUMS | sha256sum -c -
          grep "tebako-shim-$ver-windows-ucrt64.exe\$" SHA256SUMS | sha256sum -c -
          mv "tebako-$ver-windows-ucrt64.exe" tebako.exe
          mv "tebako-shim-$ver-windows-ucrt64.exe" tebako-shim.exe

      - name: Fetch the iteration tebako tool (a release run's staged bytes)
        if: inputs.tools_run != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bin-windows-ucrt64
          path: .tools
          run-id: ${{ inputs.tools_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard the iteration artifact + place the tool
        if: inputs.tools_run != ''
        shell: bash
        run: |
          set -euo pipefail
          [ -f .tools/.leg-complete ] || {
            echo "::error::the bin-windows-ucrt64 artifact of run ${{ inputs.tools_run }} carries no .leg-complete marker — the build leg died before its gates passed; these bytes are not pressable"
            exit 1
          }
          exe=$(ls .tools/tebako-*-windows-ucrt64.exe 2>/dev/null | head -1)
          [ -n "$exe" ] || { echo "::error::no tebako-*-windows-ucrt64.exe in the artifact"; exit 1; }
          mv "$exe" .tools/tebako.exe
          ver="2.8.44"
          base="https://github.com/tamatebako/tebako/releases/download/v$ver"
          cd .tools
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 "$base/tebako-shim-$ver-windows-ucrt64.exe"
          echo "::notice::ITERATION RUN — pressing with unreleased tools from release run ${{ inputs.tools_run }}; a green result here is engineering evidence, not a shippable verdict"

      - name: Precompile assets at press time
        working-directory: myapp
        run: bundle exec rails assets:precompile

      # tebako#753 phase 2: the press's native-extension deploy builds
      # source-only gems (bigdecimal, json, prism, erb, io-console,
      # nio4r — no precompiled ucrt variants) against the runtime SDK.
      # That needs sh + the ucrt toolchain on PATH: the SDK replays the
      # runtime's recorded configure through sh (a shell script — no
      # CreateProcess target), and mkmf's probes compile with gcc/make.
      # Both are ALREADY here: ruby/setup-ruby's DevKit puts its msys2
      # tree's ucrt64\bin (gcc, nm, ar, make) and usr\bin (sh.exe) on
      # PATH (RI_DEVKIT). A setup-msys2 step is NOT the answer — its
      # cache restore collides with the toolchain the runner already has
      # ("Trying to install MSYS2 to D:\a\_temp\msys64 but that already
      # exists", twice). The press rides Git Bash: its sh.exe answers the
      # SDK's spawn and the DevKit's ucrt64\bin answers mkmf's.
      - name: Press the Rails application (self-contained)
        shell: bash
        run: |
          set -euo pipefail
          # The DevKit's ucrt64 gcc must win over the runner image's
          # legacy C:\mingw64 (msvcrt) gcc — the runtime is ucrt.
          devkit_ucrt="$(cygpath "$RI_DEVKIT")/ucrt64/bin"
          export PATH="$devkit_ucrt:$PATH"
          gcc --version | head -1
          sh --version | head -1
          make --version | head -1
          .tools/tebako.exe press \
            --root myapp \
            --entry-point bin/rails \
            --Ruby 3.4.10 \
            --mode self-contained \
            --output dist/myapp

      - name: Boot the packaged Rails stack
        shell: bash
        run: |
          set -euo pipefail
          # The runner boots the full Rails stack inside the packaged
          # executable — autoloaders, initializers, railties. The
          # marker line proves the stack answered from INSIDE the
          # package (the host ruby here is only the generator).
          out="$(dist/myapp.exe runner 'puts "RAILS-BOOT-OK-#{Rails.version}"')"
          echo "$out"
          echo "$out" | grep -E 'RAILS-BOOT-OK-[0-9]'

      - name: The jailed writes work inside the package
        shell: bash
        run: |
          set -euo pipefail
          out="$(dist/myapp.exe runner 'FileUtils.mkdir_p("tmp/validate"); File.write("tmp/validate/marker", "w"); puts File.read("tmp/validate/marker")')"
          echo "$out"
          [ "$(echo "$out" | tail -1)" = "w" ]
