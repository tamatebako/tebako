name: Debug — ubuntu tebako-info SIGSEGV

# One-off diagnostic: tebako-info --lib test binary SIGSEGVs on ubuntu CI
# (run 30296428693) — the same intermittent native-fragility class as
# #350's double-free. Valgrind and --test-threads=1 runs are clean, so the
# prime suspect is an init race under Rust's parallel test harness in the
# statically-linked C++ crypto stack (OpenSSL EVP / botan). Strategy:
# hammer the native run to measure the crash rate, then serialize to test
# the race theory, and catch one crash under gdb for the backtrace.
# Delete this workflow once the root cause is fixed.

on:
  push:
    branches: [debug/**]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  VCPKG_COMMIT: f14401ca0f2754347c3864da7488a9b955b4e47a

jobs:
  segv-hunt:
    name: tebako-info --lib segv hunt (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: tebako-rs

      - name: Checkout dwarfs-rs (sibling path dep)
        uses: actions/checkout@v4
        with:
          repository: tamatebako/dwarfs-rs
          path: dwarfs-rs
          submodules: recursive

      - uses: dtolnay/rust-toolchain@1.94.1

      - name: Install native build tools + gdb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            autoconf automake autoconf-archive libtool \
            curl zip unzip tar ca-certificates libbz2-dev gdb

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgDirectory: ${{ github.workspace }}/.vcpkg-root

      - name: Cache vcpkg package archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-archives-${{ runner.os }}-${{ hashFiles('dwarfs-rs/dwarfs-t/vcpkg.json', 'dwarfs-rs/dwarfs-t/vcpkg_ports/**', 'dwarfs-rs/dwarfs-t/vcpkg_triplets/**', 'tebako-rs/crates/sqfs-sys/vcpkg.json', 'tebako-rs/crates/sqfs-sys/vcpkg_ports/**', 'tebako-rs/crates/sqfs-sys/vcpkg_triplets/**') }}
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-

      - name: Pre-install squashfs-tools-ng (serialized)
        working-directory: tebako-rs
        run: |
          ../.vcpkg-root/vcpkg install \
            --vcpkg-root "${{ github.workspace }}/.vcpkg-root" \
            --x-wait-for-lock \
            --x-manifest-root crates/sqfs-sys \
            --x-install-root "${{ github.workspace }}/.sqfs-installed" \
            --triplet x64-linux-static \
            --overlay-triplets crates/sqfs-sys/vcpkg_triplets \
            --overlay-ports crates/sqfs-sys/vcpkg_ports
          echo "SQFS_SYS_VCPKG_INSTALLED_DIR=${{ github.workspace }}/.sqfs-installed/x64-linux-static" >> "$GITHUB_ENV"

      - name: Build the tebako-info test binary
        working-directory: tebako-rs
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
        run: cargo test -p tebako-info --lib --no-run

      - name: Native loop (default threads) — crash rate
        working-directory: tebako-rs
        run: |
          BIN=$(ls -t target/debug/deps/tebako_info-* | grep -v '\.d$' | head -1)
          echo "binary: $BIN"
          CRASHES=0
          for i in $(seq 1 12); do
            timeout 180 "$BIN" > /tmp/run$i.log 2>&1
            RC=$?
            if [ $RC -eq 124 ]; then
              CRASHES=$((CRASHES+1))
              echo "=== iteration $i HUNG (timeout) — deadlock variant ==="
              tail -6 /tmp/run$i.log
            elif [ $RC -ne 0 ]; then
              CRASHES=$((CRASHES+1))
              echo "=== crash at iteration $i (exit $RC) — log tail ==="
              tail -12 /tmp/run$i.log
            fi
          done
          echo "native crashes: $CRASHES/12"
          echo "crashes=$CRASHES" >> "$GITHUB_ENV"

      - name: Serialized loop (--test-threads=1)
        working-directory: tebako-rs
        run: |
          BIN=$(ls -t target/debug/deps/tebako_info-* | grep -v '\.d$' | head -1)
          CRASHES=0
          for i in $(seq 1 12); do
            timeout 180 "$BIN" --test-threads=1 > /tmp/ser$i.log 2>&1 || { RC=$?; CRASHES=$((CRASHES+1)); echo "crash/hang at iteration $i (exit $RC)"; }
          done
          echo "serialized crashes: $CRASHES/12"

      - name: gdb loop — backtrace on the first crashing iteration
        working-directory: tebako-rs
        run: |
          BIN=$(ls -t target/debug/deps/tebako_info-* | grep -v '\.d$' | head -1)
          set +e
          for i in $(seq 1 10); do
            timeout 300 gdb -batch -ex run -ex "bt 40" "$BIN" > /tmp/gdb$i.log 2>&1
            if grep -qE "SIGSEGV|SIGABRT" /tmp/gdb$i.log && ! grep -q "exited normally" /tmp/gdb$i.log; then
              echo "=== crash captured on attempt $i ==="
              grep -B3 -A40 "SIGSEGV\|SIGABRT" /tmp/gdb$i.log | head -60
              break
            fi
            echo "attempt $i clean"
          done
          exit 0
