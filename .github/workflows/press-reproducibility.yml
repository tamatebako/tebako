name: Press reproducibility

# The cross-host leg of the reproducible-press covenant, measured on the
# artifact that can actually be identical across hosts: the PAYLOAD IMAGE.
#
# Why not the package: a pressed package embeds the host's runtime pair and
# the host's bootstrap binary, so two hosts cannot produce the same package
# bytes (first run of this workflow, 39874765407, proved it: 16,998,896 B /
# ARM64 vs 21,796,048 B / X64 at the same commit and stamps). The payload
# image is runtime-independent — the thing registries publish — so the
# comparison belongs here.
#
# Same-host PACKAGE identity is a unit-level property, already pinned by the
# press tests (#880: two presses → 03222a71… twice).
#
# What it does NOT prove: bit-identical output across ARCHITECTURES. Each
# leg images for its own host with its host's `tfs`; equal digests are
# expected because the writer's output is architecture-neutral for the same
# input, and a failure here is a real portability defect.

on:
  schedule:
    # Nightly 04:43 UTC — offset from the CI nightly (03:17).
    - cron: "43 4 * * *"
  workflow_dispatch:

concurrency:
  group: press-reproducibility-${{ github.ref }}
  cancel-in-progress: true

env:
  # The tfs CLI release both legs image with — the SAME version, or the
  # comparison means nothing (the job asserts it).
  TFS_VERSION: "2.8.57"
  # The reproducible-builds pin; both legs must agree (asserted).
  SOURCE_DATE_EPOCH: "1700000000"

jobs:
  image:
    name: image (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the pinned tfs CLI (sha256-verified)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "macOS" ]; then TRIPLET=macos-arm64
          elif [ "${{ runner.arch }}" = "ARM64" ]; then TRIPLET=linux-gnu-arm64
          else TRIPLET=linux-gnu-x86_64; fi
          asset="tfs-$TFS_VERSION-$TRIPLET"
          base="https://github.com/tamatebako/tebako/releases/download/v$TFS_VERSION"
          curl -fsSLO --retry 5 --retry-all-errors "$base/$asset"
          curl -fsSLO --retry 5 --retry-all-errors "$base/$asset.sha256"
          # The sidecar is `sha256  name`; verify exactly that line.
          grep "  $asset$" "$asset.sha256" > want.txt || true
          if [ -s want.txt ]; then
            shasum -a 256 -c want.txt
          else
            echo "::error::$asset.sha256 does not name $asset — refusing an unanchored binary"
            exit 1
          fi
          chmod +x "$asset"
          mv "$asset" tfs

      - name: Image the committed payload tree
        run: |
          set -euo pipefail
          echo "inputs: commit=${{ github.sha }} tfs=$TFS_VERSION source_date_epoch=$SOURCE_DATE_EPOCH"
          mkdir -p out
          ./tfs mkimage --format limnifs ci/fixtures/repro-payload --output out/repro-app.tfs
          sha=$(shasum -a 256 out/repro-app.tfs | cut -d' ' -f1)
          size=$(wc -c < out/repro-app.tfs | tr -d ' ')
          printf '{"os":"%s","runner_arch":"%s","tfs":"%s","source_date_epoch":"%s","commit":"%s","sha256":"%s","size":%s}\n' \
            "${{ matrix.os }}" "${{ runner.arch }}" "$TFS_VERSION" "$SOURCE_DATE_EPOCH" \
            "${{ github.sha }}" "$sha" "$size" > out/record.json
          cat out/record.json

      - name: Upload the image and its record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.os }}
          path: |
            out/repro-app.tfs
            out/record.json
          if-no-files-found: error

  compare:
    name: compare the images
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: image-*
          merge-multiple: false

      - name: Compare (fail naming the pair and the first differing offset)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys

          records = []
          for record in pathlib.Path(".").glob("image-*/record.json"):
              records.append((record.parent.name, json.loads(record.read_text())))
          records.sort()
          if len(records) < 2:
              sys.exit(f"expected at least two legs, found {len(records)}: {[r[0] for r in records]}")

          for name, rec in records:
              print(f"{name}: sha256={rec['sha256']} size={rec['size']} tfs={rec['tfs']} "
                    f"epoch={rec['source_date_epoch']} commit={rec['commit'][:12]} arch={rec['runner_arch']}")

          commits = {r["commit"] for _, r in records}
          versions = {r["tfs"] for _, r in records}
          epochs = {r["source_date_epoch"] for _, r in records}
          if len(commits) != 1 or len(versions) != 1 or len(epochs) != 1:
              sys.exit(f"the INPUTS differ across legs — commit={commits} tfs={versions} epoch={epochs}")

          base_name, base = records[0]
          base_bytes = pathlib.Path(base_name, "repro-app.tfs").read_bytes()
          failed = False
          for name, rec in records[1:]:
              if rec["sha256"] == base["sha256"] and rec["size"] == base["size"]:
                  continue
              failed = True
              other = pathlib.Path(name, "repro-app.tfs").read_bytes()
              first = next((i for i, (a, b) in enumerate(zip(base_bytes, other)) if a != b),
                           min(len(base_bytes), len(other)))
              print(f"::error::image differs: {base_name} ({base['sha256'][:12]}, {base['size']} B) vs "
                    f"{name} ({rec['sha256'][:12]}, {rec['size']} B); first difference at offset {first}")
          if failed:
              sys.exit(1)
          print(f"all {len(records)} legs imaged byte-identically: {base['sha256']}")
          PY
