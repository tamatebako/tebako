# tebako-rs release pipeline (item 31): build and upload the five
# binaries (tebako-bootstrap, tfs, tebako-pkg, tebako) per release
# platform, with the size-gate table, SHA256SUMS and manifest.json.
#
# Shape: parsanol-rs's release-binary.yml — prepare (get_release →
# upload_url) → native runners per OS → `gh release upload` per artifact
# (the archived actions/upload-release-asset was retired 2026-08-01) —
# plus our additions: the vendored native deps via vcpkg
# (baseline pin + archive cache, mirrored from ci.yml), the musl legs in
# Alpine containers (docker run from the host; the proven native-musl
# path — see ci/musl-build.sh; node actions cannot run on musl), the
# bootstrap size gate (back to 3 MB: rnp/botan is feature-gated out of
# the shipped bootstrap — unverified-first, roadmap 72), and the item-11
# completeness gate (the finalize job fails unless every expected asset
# landed).
#
# Unsigned-first: SHA256SUMS + manifest.json ship from day one; detached
# signatures slot in later (item 29 phase 2) by signing SHA256SUMS and
# uploading .asc files — no restructuring.
#
# Windows (ucrt64) is a disabled leg, documented at the bottom.
#
# Crypto: rnp-rs 0.1.8 prebuilt is self-contained — librnp + json-c +
# MINIMIZED botan + libbz2 static archives ship inside the crate; no
# provisioning, no system crypto, anywhere (musl included).

name: Release

on:
  release:
    types:
      # 'published' fires for final releases AND prereleases (the
      # 'prereleased' type would double-trigger for the latter).
      - published
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Must match ci.yml (the dwarfs-t vcpkg baseline).
  VCPKG_COMMIT: f14401ca0f2754347c3864da7488a9b955b4e47a
  RUST_VERSION: "1.94.1"
  BOOTSTRAP_SIZE_BUDGET: 3145728

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      tag_name: ${{ steps.vars.outputs.tag_name }}
      version: ${{ steps.vars.outputs.version }}
      upload_url: ${{ steps.get_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get release
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Resolve tag and version
        id: vars
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # ==========================================================================
  # macOS (native runners, both arches — parsanol shape)
  # ==========================================================================
  macos:
    name: macOS (${{ matrix.platform }})
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-arm64
            triplet: arm64-osx-static
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            triplet: x64-osx-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tebako-rs
      - name: Checkout dwarfs-rs (sibling path dep)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/dwarfs-rs
          path: dwarfs-rs
          submodules: recursive

      - name: Restore the vcpkg baseline (dwarfs-t is the single writer)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Never fails the leg: a miss means the ports build normally.
        # The script owns the canonical root and exports
        # DWARFS_RS_VCPKG_INSTALLED_DIR into GITHUB_ENV.
        run: |
          bash dwarfs-rs/dwarfs-t/ci/vcpkg-baseline-restore.sh \
            dwarfs-rs/dwarfs-t "${{ matrix.triplet }}" \
            || echo "baseline miss — ports build normally"

      - uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1

      - name: Install native build tools
        run: brew install ninja autoconf automake autoconf-archive libtool


      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgDirectory: ${{ github.workspace }}/.vcpkg-root

      - name: Cache vcpkg package archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/vcpkg
          key: vcpkg-archives-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dwarfs-rs/dwarfs-t/vcpkg.json', 'dwarfs-rs/dwarfs-t/vcpkg_ports/**', 'dwarfs-rs/dwarfs-t/vcpkg_triplets/**', 'tebako-rs/crates/sqfs-sys/vcpkg.json', 'tebako-rs/crates/sqfs-sys/vcpkg_ports/**', 'tebako-rs/crates/sqfs-sys/vcpkg_triplets/**') }}
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-${{ runner.arch }}-

      - name: Pre-install squashfs-tools-ng (serialized)
        working-directory: tebako-rs
        run: |
          ../.vcpkg-root/vcpkg install \
            --vcpkg-root "${{ github.workspace }}/.vcpkg-root" \
            --x-wait-for-lock \
            --x-manifest-root crates/sqfs-sys \
            --x-install-root "${{ github.workspace }}/.sqfs-installed" \
            --triplet "${{ matrix.triplet }}" \
            --overlay-triplets crates/sqfs-sys/vcpkg_triplets \
            --overlay-ports crates/sqfs-sys/vcpkg_ports
          echo "SQFS_SYS_VCPKG_INSTALLED_DIR=${{ github.workspace }}/.sqfs-installed/${{ matrix.triplet }}" >> "$GITHUB_ENV"

      - name: Build the five binaries (release)
        working-directory: tebako-rs
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
        run: |
          cargo build --release --target ${{ matrix.target }} \
            -p tebako-bootstrap -p tfs-cli -p tebako-pkg -p tebako-cli -p tebako-shim

      - name: Stage, strip, size-gate
        working-directory: tebako-rs
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: bash .github/workflows/lib/stage.sh

      - name: Stage the link unit (tebako-driver + tfs, scoped, + closure)
        working-directory: tebako-rs
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          SQFS_SYS_VCPKG_ROOT: ${{ github.workspace }}/.sqfs-installed/${{ matrix.triplet }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p out/link-unit-$PLATFORM
          ruby tools/stage_link_unit "out/link-unit-$PLATFORM" --skip-build
          tar -czf "out/link-unit-${VERSION}-${PLATFORM}.tar.gz" -C out "link-unit-$PLATFORM"

      - name: Upload link-unit
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/link-unit-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload fragment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frag-${{ matrix.platform }}
          path: tebako-rs/fragments/frag-${{ matrix.platform }}

      - name: Upload tebako-bootstrap
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-bootstrap-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tfs
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tfs-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako-pkg
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-pkg-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako-shim
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-shim-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Linux GNU (native runners incl. arm64 — no cross)
  # ==========================================================================
  linux-gnu:
    name: Linux GNU (${{ matrix.platform }})
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-gnu-x86_64
            triplet: x64-linux-static
            dyn_triplet: x64-linux-dynamic
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-gnu-arm64
            triplet: arm64-linux-static
            dyn_triplet: arm64-linux-dynamic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tebako-rs
      - name: Checkout dwarfs-rs (sibling path dep)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/dwarfs-rs
          path: dwarfs-rs
          submodules: recursive

      - name: Restore the vcpkg baseline (dwarfs-t is the single writer)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Never fails the leg: a miss means the ports build normally.
        # The script owns the canonical root and exports
        # DWARFS_RS_VCPKG_INSTALLED_DIR into GITHUB_ENV.
        run: |
          bash dwarfs-rs/dwarfs-t/ci/vcpkg-baseline-restore.sh \
            dwarfs-rs/dwarfs-t "${{ matrix.triplet }}" \
            || echo "baseline miss — ports build normally"

      - uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            autoconf automake autoconf-archive libtool \
            curl zip unzip tar ca-certificates \
            libbz2-dev


      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgDirectory: ${{ github.workspace }}/.vcpkg-root

      - name: Cache vcpkg package archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-archives-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dwarfs-rs/dwarfs-t/vcpkg.json', 'dwarfs-rs/dwarfs-t/vcpkg_ports/**', 'dwarfs-rs/dwarfs-t/vcpkg_triplets/**', 'tebako-rs/crates/sqfs-sys/vcpkg.json', 'tebako-rs/crates/sqfs-sys/vcpkg_ports/**', 'tebako-rs/crates/sqfs-sys/vcpkg_triplets/**') }}
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-${{ runner.arch }}-

      - name: Pre-install squashfs-tools-ng (serialized)
        working-directory: tebako-rs
        run: |
          ../.vcpkg-root/vcpkg install \
            --vcpkg-root "${{ github.workspace }}/.vcpkg-root" \
            --x-wait-for-lock \
            --x-manifest-root crates/sqfs-sys \
            --x-install-root "${{ github.workspace }}/.sqfs-installed" \
            --triplet "${{ matrix.triplet }}" \
            --overlay-triplets crates/sqfs-sys/vcpkg_triplets \
            --overlay-ports crates/sqfs-sys/vcpkg_ports
          echo "SQFS_SYS_VCPKG_INSTALLED_DIR=${{ github.workspace }}/.sqfs-installed/${{ matrix.triplet }}" >> "$GITHUB_ENV"

      - name: Build the five binaries (release)
        working-directory: tebako-rs
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
        run: |
          cargo build --release --target ${{ matrix.target }} \
            -p tebako-bootstrap -p tfs-cli -p tebako-pkg -p tebako-cli -p tebako-shim

      - name: Stage, strip, size-gate
        working-directory: tebako-rs
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: bash .github/workflows/lib/stage.sh

      - name: Stage the link unit (tebako-driver + tfs, scoped, + closure)
        working-directory: tebako-rs
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          SQFS_SYS_VCPKG_ROOT: ${{ github.workspace }}/.sqfs-installed/${{ matrix.triplet }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p out/link-unit-$PLATFORM
          ruby tools/stage_link_unit "out/link-unit-$PLATFORM" --skip-build
          tar -czf "out/link-unit-${VERSION}-${PLATFORM}.tar.gz" -C out "link-unit-$PLATFORM"

      - name: Upload link-unit
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/link-unit-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload fragment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frag-${{ matrix.platform }}
          path: tebako-rs/fragments/frag-${{ matrix.platform }}

      - name: Upload tebako-bootstrap
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-bootstrap-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tfs
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tfs-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako-pkg
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-pkg-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako-shim
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-shim-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Linux musl (Alpine container via docker run from the glibc host —
  # node actions cannot run on musl; the proven native-musl path:
  # vcpkg bootstrapped from source, flatc runs natively).
  # ==========================================================================
  linux-musl:
    name: Linux musl (${{ matrix.platform }})
    # Enabled since rnp-rs 0.1.10: the rnp-src model builds librnp+botan
    # from source (musl-capable; the container has cmake/ninja/python3).
    # rnp-src resolves from crates.io 0.1.2 (the rnpgp/rnp-rs#63 fix —
    # the is_packaging() misfire that broke 0.1.1's vendored mode).
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux-musl-x86_64
            triplet: x64-linux-musl
            dyn_triplet: x64-linux-musl-dynamic
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-musl-arm64
            triplet: arm64-linux-musl
            dyn_triplet: arm64-linux-musl-dynamic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tebako-rs
      - name: Checkout dwarfs-rs (sibling path dep)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/dwarfs-rs
          path: dwarfs-rs
          submodules: recursive

      - name: Cache vcpkg package archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-archives-musl-${{ runner.arch }}-${{ hashFiles('dwarfs-rs/dwarfs-t/vcpkg.json', 'dwarfs-rs/dwarfs-t/vcpkg_ports/**', 'dwarfs-rs/dwarfs-t/vcpkg_triplets/**', 'tebako-rs/crates/sqfs-sys/vcpkg.json', 'tebako-rs/crates/sqfs-sys/vcpkg_ports/**', 'tebako-rs/crates/sqfs-sys/vcpkg_triplets/**') }}
          restore-keys: |
            vcpkg-archives-musl-${{ runner.arch }}-

      - name: Build in the Alpine container (docker run)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          TRIPLET: ${{ matrix.triplet }}
          DYN_TRIPLET: ${{ matrix.dyn_triplet }}
          RUST_VERSION: ${{ env.RUST_VERSION }}
          VCPKG_COMMIT: ${{ env.VCPKG_COMMIT }}
          BOOTSTRAP_SIZE_BUDGET: ${{ env.BOOTSTRAP_SIZE_BUDGET }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$HOME/.cache/vcpkg:/root/.cache/vcpkg" \
            -e VERSION -e PLATFORM -e TARGET -e TRIPLET -e DYN_TRIPLET \
            -e RUST_VERSION -e VCPKG_COMMIT -e BOOTSTRAP_SIZE_BUDGET \
            -e GITHUB_STEP_SUMMARY -e GITHUB_WORKSPACE \
            alpine:3.21 sh "$GITHUB_WORKSPACE/tebako-rs/ci/musl-build.sh"

      - name: Upload fragment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frag-${{ matrix.platform }}
          path: tebako-rs/fragments/frag-${{ matrix.platform }}

      - name: Upload tebako-bootstrap
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-bootstrap-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tfs
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tfs-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako-pkg
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-pkg-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako-shim
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-shim-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload link-unit
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/link-unit-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # finalize: SHA256SUMS + manifest.json + the item-11 completeness gate
  # ==========================================================================
  finalize:
    name: Finalize (sums, manifest, gate)
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    needs: [prepare, macos, linux-gnu, linux-musl, windows-link-unit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: frag-*
          path: fragments
          # No merge-multiple: each frag-<platform> artifact must land in
          # its OWN directory (fragments/frag-<platform>/) — finalize.sh
          # globs per-platform. merge-multiple: true flattens them.

      - name: SHA256SUMS + manifest.json + size table
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          UPLOAD: ${{ needs.prepare.outputs.upload_url }}
          TAG: ${{ needs.prepare.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/workflows/lib/finalize.sh

      - name: Upload SHA256SUMS
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "out/SHA256SUMS" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload manifest.json
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "out/manifest.json" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # item 11's completeness gate: the release job fails unless every
      # expected asset actually landed (partial-upload race class).
      - name: Completeness gate
        if: needs.prepare.outputs.upload_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag_name }}
        run: |
          EXPECTED=$(( 5 * 6 + 7 + 2 ))   # 5 tools x 6 platforms + 7 link-unit tarballs (incl. windows-gnu) + SHA256SUMS + manifest.json
          COUNT=$(gh release view "$TAG" --json assets --jq '.assets | length')
          echo "release assets: $COUNT / $EXPECTED expected"
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort
          test "$COUNT" -eq "$EXPECTED"

  # ==========================================================================
  # Windows (ucrt64) — the link-unit leg. The staticlibs build and scope
  # (the COFF arscope) and the mingw closure lands; the five binaries wait
  # for the windows exec/lock ports (bootstrap) and the POSIX-oriented
  # spawn/scrub paths (cli), tracked in TODO.v2-1.
  # ==========================================================================
  windows-link-unit:
    name: Windows link-unit (ucrt64)
    runs-on: windows-latest
    needs: prepare
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tebako-rs
      - name: Checkout dwarfs-rs (sibling path dep)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/dwarfs-rs
          path: dwarfs-rs
          submodules: recursive

      - name: Restore the vcpkg baseline (dwarfs-t is the single writer)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Never fails the leg: a miss means the ports build normally.
        # The script owns the canonical root (C:/vcpkg-inst — also the
        # MAX_PATH dodge) and exports DWARFS_RS_VCPKG_INSTALLED_DIR into
        # GITHUB_ENV (the stage step's closure lookup reads it).
        run: |
          bash dwarfs-rs/dwarfs-t/ci/vcpkg-baseline-restore.sh \
            dwarfs-rs/dwarfs-t x64-mingw-static \
            || echo "baseline miss — ports build normally"

      - uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1
        with:
          targets: x86_64-pc-windows-gnu

      # The proven windows-gnu shape (dwarfs-t's green CI + the factory's
      # msys campaign): Git-bash steps + the runner's built-in MinGW +
      # get-cmake, NEVER an msys2 shell or msys2 bin on PATH (vcpkg's own
      # msys2 ABI-clashes with it; the autotools ports die in install).
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      # the stage script is ruby
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgDirectory: ${{ github.workspace }}/.vcpkg-root

      - name: Cache vcpkg package archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-archives-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dwarfs-rs/dwarfs-t/vcpkg.json', 'dwarfs-rs/dwarfs-t/vcpkg_ports/**', 'dwarfs-rs/dwarfs-t/vcpkg_triplets/**') }}
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-${{ runner.arch }}-

      - name: Build the windows-gnu staticlibs (tfs, dwarfs-only)
        working-directory: tebako-rs
        shell: bash
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          # Static-link the mingw C++ runtimes: the runner carries several
          # mingw installs and first-DLL-wins resolution is
          # STATUS_ENTRYPOINT_NOT_FOUND at process start. The trailing
          # -lmsvcrt restores the msvcrt-after-mingwex order invariant
          # (rustc's -nodefaultlibs tail violates it; the factory probe
          # proved libmingwex's compat _assert.o then dies on
          # __imp___msvcrt_assert).
          RUSTFLAGS: -C link-arg=-static-libgcc -C link-arg=-static-libstdc++ -C link-arg=-lmsvcrt
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:$PATH"
          cargo build --release --target x86_64-pc-windows-gnu \
            -p tfs --no-default-features --features vendored-dwarfs \
            -p tebako-driver

      - name: Stage the link unit (scoped, + the mingw closure)
        working-directory: tebako-rs
        shell: bash
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:$PATH"
          mkdir -p out/link-unit-x86_64-windows-gnu
          ruby tools/stage_link_unit out/link-unit-x86_64-windows-gnu \
            --target x86_64-pc-windows-gnu --skip-build
          tar -czf "out/link-unit-${VERSION}-x86_64-windows-gnu.tar.gz" -C out link-unit-x86_64-windows-gnu

      - name: Upload link-unit
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/link-unit-${{ needs.prepare.outputs.version }}-x86_64-windows-gnu.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Windows (ucrt64) — the FULL leg (the five binaries). Still blocked on:
  #  - tebako-bootstrap: the Windows exec/lock ports are not implemented
  #    (M6 v1 ships macOS/Linux).
  #  - tebako-cli's runtime-spawn/scrub paths are POSIX-oriented.
  # When those land, enable this leg on windows-latest (ucrt64 target).
  # ==========================================================================
  windows:
    name: Windows binaries (ucrt64) — DISABLED (see blockers above)
    if: false
    runs-on: windows-latest
    needs: prepare
    steps:
      - run: echo "disabled — see the blockers documented in the job header"
