# tebako-rs release pipeline (item 31): build and upload the five
# binaries (tebako-bootstrap, tfs, tebako-pkg, tebako) per release
# platform, with the size-gate table, SHA256SUMS and manifest.json.
#
# Triggers: a `v*` tag push IS the release event — `prepare` creates the
# Release object itself (the v0.2.5 lesson: release:published alone left
# a bare tag with no assets, the tag having been pushed before any
# Release existed). `release: published` is deliberately absent: the
# pipeline owns the release's lifecycle, and a self-created release would
# double-fire it. `workflow_dispatch` stays a build+gate dry run (every
# upload gates on the prepared upload_url).
#
# Shape: parsanol-rs's release-binary.yml — prepare (get_release →
# upload_url) → native runners per OS → `gh release upload` per artifact
# (the archived actions/upload-release-asset was retired 2026-08-01) —
# plus our additions: the vendored native deps via vcpkg
# (baseline pin + the org's GitHub Packages NuGet binary cache on the
# native legs — the run-vcpkg x-gha injection is dead since vcpkg 2025.06;
# the container legs keep the mounted-archives actions/cache), the musl
# legs in
# Alpine containers (docker run from the host; the proven native-musl
# path — see ci/musl-build.sh; node actions cannot run on musl), the
# bootstrap size gate (back to 3 MB: rnp/botan is feature-gated out of
# the shipped bootstrap — unverified-first, roadmap 72), and the item-11
# completeness gate (the finalize job fails unless every expected asset
# landed).
#
# The ship gate (.github/workflows/lib/ship-gate.sh): every leg proves
# its staged binaries BEFORE any upload — a bare no-op launch in the
# cleanest environment the leg allows (windows: PATH scrubbed of every
# msys2/ucrt64/Git bin dir; linux-gnu: a PRISTINE ubuntu:20.04
# container, the floor the leg claims; linux-musl: a pristine
# alpine:3.21; macos: plain launch) plus a hard dynamic-dependency
# whitelist audit (PE imports / ldd / otool -L). A broken binary fails
# its own leg and blocks finalize — it never ships (the 0.1.1 windows
# exes imported ucrt64 DLLs and died before main on stock Windows with
# build-success as the only gate).
#
# Release signing (spec 09 §2): unsigned stays first-class, but when the
# repo variable TEBAKO_RELEASE_SIGNING_ENABLED=true the finalize job signs
# every released part (one detached .asc per artifact) plus SHA256SUMS and
# manifest.json with the release signing subkey (the
# TEBAKO_RELEASE_SIGNING_KEY secret), using the PREVIOUS release's pinned,
# sha256-verified tebako-pkg — a release is never the first execution of
# its own bits. Armed + a missing secret is a fast named failure.
#
# macOS signing (spec 31 §5): the macOS legs codesign (Developer ID
# Application, hardened runtime) the staged binaries BEFORE their sha256
# fragments are written, then notarize + quarantine-mark them so the leg's
# own ship gate is the Gatekeeper exec canary. The legs run unsigned BY
# DESIGN (spec 00 invariant 7) unless the repo variable
# APPLE_SIGNING_ENABLED=true arms the gate; armed + a missing APPLE_*
# secret is a fast named failure, never a partial release.
#
# Windows (ucrt64) ships from the `windows` job (the five binaries,
# platform id windows-ucrt64 per the spec 03 §3 axis) and the
# `windows-link-unit` job (the factory's staticlib input).
#
# Crypto: rnp-rs 0.1.8 prebuilt is self-contained — librnp + json-c +
# MINIMIZED botan + libbz2 static archives ship inside the crate; no
# provisioning, no system crypto, anywhere (musl included).

name: Release

on:
  push:
    tags:
      # A tag push IS the release event (the v0.2.5 lesson: a tag alone
      # built nothing when only release:published triggered — the tag was
      # pushed, no Release object existed, no run fired). prepare creates
      # the Release itself; every leg uploads against it.
      - "v*"
  workflow_dispatch:

concurrency:
  # One run per ref: a re-pushed tag serializes behind its in-flight run
  # instead of racing the same release's asset set (uploads clobber, the
  # completeness gate counts — a twin run's interleave would flake both).
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Every build leg checks out into the tebako-rs/ (and dwarfs-rs/)
  # subdir, so $GITHUB_WORKSPACE itself is NOT a git repository and gh's
  # git-based repo resolution dies ("failed to run git: fatal: not a git
  # repository"). Name the repo explicitly for every gh invocation.
  GH_REPO: ${{ github.repository }}
  # Must match ci.yml (the dwarfs-t vcpkg baseline).
  VCPKG_COMMIT: f14401ca0f2754347c3864da7488a9b955b4e47a
  RUST_VERSION: "1.94.1"
  BOOTSTRAP_SIZE_BUDGET: 3145728

jobs:
  prepare:
    name: Prepare
    permissions:
      # The tag-push leg creates the Release object itself.
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      tag_name: ${{ steps.vars.outputs.tag_name }}
      version: ${{ steps.vars.outputs.version }}
      upload_url: ${{ steps.get_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the release when the tag has none
        # A tag push arrives BEFORE any Release object exists (and the
        # GITHUB_TOKEN's own create would not re-trigger this workflow,
        # so there is exactly one run per tag either way). Idempotent: a
        # re-pushed tag whose release already exists is a no-op.
        if: github.event_name == 'push'
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes "tebako ${{ github.ref_name }} — built by the Release pipeline ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Get release
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        # workflow_dispatch has no release to get: tolerate the miss so a
        # dispatch is a build+gate dry run (every upload/publish step is
        # already gated on upload_url != ''). Tag-push events stay strict
        # — the create step above guarantees the object, so a get-release
        # failure there must fail the pipeline.
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Resolve tag and version
        id: vars
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          VERSION="${TAG#v}"
          # A workflow_dispatch carries the BRANCH name (ci/foo), and the
          # version lands in the staged artifact filenames — slashes
          # would make them paths. Real tags never contain one.
          echo "version=${VERSION//\//-}" >> "$GITHUB_OUTPUT"

  # ==========================================================================
  # macOS (native runners, both arches — parsanol shape)
  # ==========================================================================
  macos:
    name: macOS (${{ matrix.platform }})
    permissions:
      contents: write
      # packages:write populates the org's GitHub Packages vcpkg binary
      # cache (ci/vcpkg-nuget-cache.sh).
      packages: write
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-arm64
            triplet: arm64-osx-static
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            triplet: x64-osx-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tebako-rs
      - name: Checkout dwarfs-rs (sibling path dep)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/dwarfs-rs
          path: dwarfs-rs
          submodules: recursive

      - name: Restore the vcpkg baseline (dwarfs-t is the single writer)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Never fails the leg: a miss means the ports build normally.
        # The script owns the canonical root and exports
        # DWARFS_RS_VCPKG_INSTALLED_DIR into GITHUB_ENV.
        run: |
          bash dwarfs-rs/dwarfs-t/ci/vcpkg-baseline-restore.sh \
            dwarfs-rs/dwarfs-t "${{ matrix.triplet }}" \
            || echo "baseline miss — ports build normally"

      - uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1

      - name: Install native build tools
        run: brew install ninja autoconf automake autoconf-archive libtool


      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgDirectory: ${{ github.workspace }}/.vcpkg-root

      # run-vcpkg@v11 injects VCPKG_BINARY_SOURCES=clear;x-gha,readwrite,
      # and vcpkg removed x-gha (2025.06) — that spec is zero binary cache,
      # and it also neutered the old actions/cache over the archives dir
      # (files provider cleared + archives path redirected). The override
      # is the org's GitHub Packages NuGet feed; the dead cache step is
      # gone (details in ci/vcpkg-nuget-cache.sh). macos runners ship mono
      # (vcpkg drives nuget.exe through it off-Windows).
      - name: Configure the vcpkg binary cache (GitHub Packages NuGet)
        working-directory: tebako-rs
        env:
          # First-push of a new package id CANNOT be done by GITHUB_TOKEN
          # (GitHub quirk: 403 on creation; community#159893) — the org
          # secret (classic PAT, write:packages) owns creation when present;
          # GITHUB_TOKEN remains the read path and the whole fallback.
          GH_TOKEN: ${{ secrets.TEBAKO_PACKAGES_PAT || secrets.GITHUB_TOKEN }}
        run: bash ci/vcpkg-nuget-cache.sh

      - name: Pre-install squashfs-tools-ng (serialized)
        working-directory: tebako-rs
        run: |
          ../.vcpkg-root/vcpkg install \
            --vcpkg-root "${{ github.workspace }}/.vcpkg-root" \
            --x-wait-for-lock \
            --x-manifest-root crates/sqfs-sys \
            --x-install-root "${{ github.workspace }}/.sqfs-installed" \
            --triplet "${{ matrix.triplet }}" \
            --overlay-triplets crates/sqfs-sys/vcpkg_triplets \
            --overlay-ports crates/sqfs-sys/vcpkg_ports
          echo "SQFS_SYS_VCPKG_INSTALLED_DIR=${{ github.workspace }}/.sqfs-installed/${{ matrix.triplet }}" >> "$GITHUB_ENV"

      - name: Build the six binaries + the link-unit libs (release)
        working-directory: tebako-rs
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
        # tfs/tebako-driver/libtfs-preload are the staticlibs (+ the
        # preload cdylib) the link-unit stage below packs with
        # --skip-build — they must be explicit -p packages or no .a/cdylib
        # is emitted (run 30742821370). tebako-cli already unifies tfs's
        # default features on POSIX, so one invocation serves both.
        # tebako-runtime-launcher (the spec-29 wrapper exe) rides the
        # same invocation — it links tebako-driver anyway.
        # tebako-bootstrap builds in its OWN invocation: cargo unifies
        # features within one invocation, and sharing one with
        # tebako-cli/tebako-shim re-enables tebako-resolve's `git`
        # feature (gix/reqwest/rustls) inside the size-gated loader —
        # run 32940980101 failed the 3 MiB gate on every leg for exactly
        # this reason. A separate invocation = separate feature
        # resolution = the bootstrap's `default-features = false` holds.
        run: |
          cargo build --release --target ${{ matrix.target }} -p tebako-bootstrap
          cargo build --release --target ${{ matrix.target }} \
            -p tfs-cli -p tebako-pkg -p tebako-cli -p tebako-shim \
            -p tebako-runtime-launcher \
            -p tfs -p tebako-driver -p libtfs-preload

      # Spec 31 §5: arm Apple signing when the repo variable
      # APPLE_SIGNING_ENABLED=true is set (unsigned stays first-class
      # otherwise — the stage/notarize steps below then no-op/skip).
      - name: Set up Apple signing (spec 31 enablement gate)
        working-directory: tebako-rs
        env:
          APPLE_SIGNING_ENABLED: ${{ vars.APPLE_SIGNING_ENABLED }}
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash ci/macos-sign-setup.sh

      - name: Stage, strip, sign, size-gate
        working-directory: tebako-rs
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          # For macos-sign-one.sh's TeamIdentifier assert (armed legs).
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .github/workflows/lib/stage.sh

      # Notarize the SIGNED staged binaries and quarantine-mark every one:
      # the ship gate right after then smokes them under the exact
      # Gatekeeper path a user's download takes (bare Mach-O keeps an
      # online ticket — stapling/spctl are bundle-only by design).
      - name: Notarize the staged binaries (spec 31)
        if: vars.APPLE_SIGNING_ENABLED == 'true'
        working-directory: tebako-rs
        env:
          APPLE_ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: bash ci/macos-notarize.sh out/*-"$VERSION-$PLATFORM"

      # The ship gate BEFORE any upload: bare-launch smoke (plain run on
      # the runner — with the notarized binaries' quarantine marks in
      # place when the spec 31 gate is armed) + the otool -L whitelist
      # (/usr/lib + /System only).
      - name: Ship gate (bare-launch smoke + dylib audit)
        working-directory: tebako-rs
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: bash .github/workflows/lib/ship-gate.sh "$PLATFORM" out/*-"$VERSION-$PLATFORM"

      - name: Stage the link unit (tebako-driver + tfs, scoped, + closure)
        working-directory: tebako-rs
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          SQFS_SYS_VCPKG_ROOT: ${{ github.workspace }}/.sqfs-installed/${{ matrix.triplet }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: bash .github/workflows/lib/link-unit-stage.sh

      - name: Upload link-unit
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/link-unit-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload fragment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frag-${{ matrix.platform }}
          path: tebako-rs/fragments/frag-${{ matrix.platform }}

      - name: Upload tebako-bootstrap
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-bootstrap-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tfs
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tfs-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako-pkg
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-pkg-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako-shim
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-shim-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako-runtime-launcher
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-runtime-launcher-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Linux GNU (native runners incl. arm64 — no cross)
  # ==========================================================================
  linux-gnu:
    name: Linux GNU (${{ matrix.platform }})
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-gnu-x86_64
            triplet: x64-linux-static
            dyn_triplet: x64-linux-dynamic
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-gnu-arm64
            triplet: arm64-linux-static
            dyn_triplet: arm64-linux-dynamic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tebako-rs
      - name: Checkout dwarfs-rs (sibling path dep)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/dwarfs-rs
          path: dwarfs-rs
          submodules: recursive

      # Deliberately NOT the NuGet feed: vcpkg runs INSIDE the ubuntu:20.04
      # container here (no run-vcpkg, so no dead x-gha injection — the
      # default files provider reads/writes the mounted ~/.cache/vcpkg,
      # and this actions/cache round-trips it). Wiring the NuGet provider
      # into the container would need mono + feed credentials in-image for
      # no observed 403 pain on these legs.
      - name: Cache vcpkg package archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-archives-floor-${{ runner.arch }}-${{ hashFiles('dwarfs-rs/dwarfs-t/vcpkg.json', 'dwarfs-rs/dwarfs-t/vcpkg_ports/**', 'dwarfs-rs/dwarfs-t/vcpkg_triplets/**', 'tebako-rs/crates/sqfs-sys/vcpkg.json', 'tebako-rs/crates/sqfs-sys/vcpkg_ports/**', 'tebako-rs/crates/sqfs-sys/vcpkg_triplets/**') }}
          restore-keys: |
            vcpkg-archives-floor-${{ runner.arch }}-

      # The glibc floor (spec 19 §3): the shipping linux-gnu artifacts
      # build INSIDE an ubuntu:20.04 container (glibc 2.31) — a 24.04
      # build refuses to start anywhere older (symbol versions are
      # one-directional). No vcpkg-baseline restore: the published
      # baseline is 24.04-built and would re-import 2.39 symbols through
      # the back door; the ports build in-leg. The build script also
      # gates the produced bootstrap on max GLIBC ≤ 2.31.
      - name: Build in the ubuntu:20.04 floor container (docker run)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          TRIPLET: ${{ matrix.triplet }}
          RUST_VERSION: ${{ env.RUST_VERSION }}
          VCPKG_COMMIT: ${{ env.VCPKG_COMMIT }}
          BOOTSTRAP_SIZE_BUDGET: ${{ env.BOOTSTRAP_SIZE_BUDGET }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$HOME/.cache/vcpkg:/root/.cache/vcpkg" \
            -e VERSION -e PLATFORM -e TARGET -e TRIPLET \
            -e RUST_VERSION -e VCPKG_COMMIT -e BOOTSTRAP_SIZE_BUDGET \
            -e GITHUB_STEP_SUMMARY -e GITHUB_WORKSPACE \
            ubuntu:20.04 bash "$GITHUB_WORKSPACE/tebako-rs/ci/gnu-floor-build.sh"

      # The ship gate BEFORE any upload, in a PRISTINE ubuntu:20.04
      # container — the exact floor the leg claims, with none of the
      # build container's apt additions (a dependency that only the
      # build container provides fails HERE, not on a user box):
      # bare-launch smoke + the ldd glibc-surface whitelist.
      - name: Ship gate (pristine ubuntu:20.04 — smoke + ldd audit)
        working-directory: tebako-rs
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE/tebako-rs" \
            ubuntu:20.04 bash .github/workflows/lib/ship-gate.sh "$PLATFORM" out/*-"$VERSION-$PLATFORM"

      - name: Upload link-unit
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/link-unit-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload fragment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frag-${{ matrix.platform }}
          path: tebako-rs/fragments/frag-${{ matrix.platform }}

      - name: Upload tebako-bootstrap
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-bootstrap-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tfs
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tfs-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako-pkg
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-pkg-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako-shim
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-shim-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako-runtime-launcher
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-runtime-launcher-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Linux musl (Alpine container via docker run from the glibc host —
  # node actions cannot run on musl; the proven native-musl path:
  # vcpkg bootstrapped from source, flatc runs natively).
  # ==========================================================================
  linux-musl:
    name: Linux musl (${{ matrix.platform }})
    # Enabled since rnp-rs 0.1.10: the rnp-src model builds librnp+botan
    # from source (musl-capable; the container has cmake/ninja/python3).
    # rnp-src resolves from crates.io 0.1.2 (the rnpgp/rnp-rs#63 fix —
    # the is_packaging() misfire that broke 0.1.1's vendored mode).
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux-musl-x86_64
            triplet: x64-linux-musl
            dyn_triplet: x64-linux-musl-dynamic
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-musl-arm64
            triplet: arm64-linux-musl
            dyn_triplet: arm64-linux-musl-dynamic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tebako-rs
      - name: Checkout dwarfs-rs (sibling path dep)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/dwarfs-rs
          path: dwarfs-rs
          submodules: recursive

      # Deliberately NOT the NuGet feed (same reasoning as the gnu-floor
      # leg): vcpkg runs inside the alpine container — no run-vcpkg, no
      # x-gha injection — and the mounted ~/.cache/vcpkg files provider
      # round-trips through this actions/cache. Alpine has no mono package,
      # so the NuGet provider cannot run in-leg at all.
      - name: Cache vcpkg package archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-archives-musl-${{ runner.arch }}-${{ hashFiles('dwarfs-rs/dwarfs-t/vcpkg.json', 'dwarfs-rs/dwarfs-t/vcpkg_ports/**', 'dwarfs-rs/dwarfs-t/vcpkg_triplets/**', 'tebako-rs/crates/sqfs-sys/vcpkg.json', 'tebako-rs/crates/sqfs-sys/vcpkg_ports/**', 'tebako-rs/crates/sqfs-sys/vcpkg_triplets/**') }}
          restore-keys: |
            vcpkg-archives-musl-${{ runner.arch }}-

      - name: Build in the Alpine container (docker run)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          TRIPLET: ${{ matrix.triplet }}
          DYN_TRIPLET: ${{ matrix.dyn_triplet }}
          RUST_VERSION: ${{ env.RUST_VERSION }}
          VCPKG_COMMIT: ${{ env.VCPKG_COMMIT }}
          BOOTSTRAP_SIZE_BUDGET: ${{ env.BOOTSTRAP_SIZE_BUDGET }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$HOME/.cache/vcpkg:/root/.cache/vcpkg" \
            -e VERSION -e PLATFORM -e TARGET -e TRIPLET -e DYN_TRIPLET \
            -e RUST_VERSION -e VCPKG_COMMIT -e BOOTSTRAP_SIZE_BUDGET \
            -e GITHUB_STEP_SUMMARY -e GITHUB_WORKSPACE \
            alpine:3.21 sh "$GITHUB_WORKSPACE/tebako-rs/ci/musl-build.sh"

      # The ship gate BEFORE any upload, in a PRISTINE alpine:3.21
      # container — a vanilla musl box (busybox sh, no toolchain
      # libraries): bare-launch smoke + the ldd whitelist (libc.musl
      # only; libstdc++/libgcc_s = FAIL — the 0.1.1 musl assets exit 127
      # here).
      - name: Ship gate (pristine alpine:3.21 — smoke + ldd audit)
        working-directory: tebako-rs
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE/tebako-rs" \
            alpine:3.21 sh .github/workflows/lib/ship-gate.sh "$PLATFORM" out/*-"$VERSION-$PLATFORM"

      - name: Upload fragment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frag-${{ matrix.platform }}
          path: tebako-rs/fragments/frag-${{ matrix.platform }}

      - name: Upload tebako-bootstrap
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-bootstrap-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tfs
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tfs-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako-pkg
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-pkg-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako-shim
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-shim-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako-runtime-launcher
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-runtime-launcher-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload link-unit
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/link-unit-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # finalize: SHA256SUMS + manifest.json + the item-11 completeness gate
  # ==========================================================================
  finalize:
    name: Finalize (sums, manifest, gate)
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    needs: [prepare, macos, linux-gnu, linux-musl, windows-link-unit, windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: frag-*
          path: fragments
          # No merge-multiple: each frag-<platform> artifact must land in
          # its OWN directory (fragments/frag-<platform>/) — finalize.sh
          # globs per-platform. merge-multiple: true flattens them.

      - name: SHA256SUMS + manifest.json + size table
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          UPLOAD: ${{ needs.prepare.outputs.upload_url }}
          TAG: ${{ needs.prepare.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/workflows/lib/finalize.sh

      - name: Upload SHA256SUMS
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "out/SHA256SUMS" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload manifest.json
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "out/manifest.json" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # tebako#493: the per-asset sidecars — the resolver's
      # first-preference index from this release on.
      - name: Upload per-asset sha256 sidecars
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" out/sidecars/*.sha256 --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Spec 09 §2: detached OpenPGP signatures — one .asc per released
      # part + signed SHA256SUMS/manifest.json — made by the PREVIOUS
      # release's pinned, sha256-verified tebako-pkg (lib/sign-release.sh).
      # TEBAKO_RELEASE_SIGNING_ENABLED=true arms the gate; armed + a
      # missing TEBAKO_RELEASE_SIGNING_KEY secret is a fast named failure;
      # disarmed ships unsigned (unsigned stays first-class — spec 09 §3).
      - name: Sign the release assets (spec 09)
        if: needs.prepare.outputs.upload_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag_name }}
          TEBAKO_RELEASE_SIGNING_ENABLED: ${{ vars.TEBAKO_RELEASE_SIGNING_ENABLED }}
          TEBAKO_RELEASE_SIGNING_KEY: ${{ secrets.TEBAKO_RELEASE_SIGNING_KEY }}
        run: bash .github/workflows/lib/sign-release.sh

      - name: Upload detached signatures
        if: needs.prepare.outputs.upload_url != '' && vars.TEBAKO_RELEASE_SIGNING_ENABLED == 'true'
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" out/signatures/*.asc --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # item 11's completeness gate: the release job fails unless every
      # expected asset actually landed (partial-upload race class).
      - name: Completeness gate
        if: needs.prepare.outputs.upload_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag_name }}
          TEBAKO_RELEASE_SIGNING_ENABLED: ${{ vars.TEBAKO_RELEASE_SIGNING_ENABLED }}
        run: |
          EXPECTED=$(( 6 * 7 + 7 + 2 + 6 * 7 ))   # 6 tools x 7 platforms (incl. windows-ucrt64; +tebako-runtime-launcher, the spec-29 wrapper exe) + 7 link-unit tarballs + SHA256SUMS + manifest.json + 42 per-asset sidecars (tebako#493)
          if [ "${TEBAKO_RELEASE_SIGNING_ENABLED:-}" = "true" ]; then
            EXPECTED=$(( EXPECTED + 6 * 7 + 7 + 2 ))   # + one .asc per released part (42 tools + 7 link-units) + SHA256SUMS.asc + manifest.json.asc (spec 09 §2)
          fi
          COUNT=$(gh release view "$TAG" --json assets --jq '.assets | length')
          echo "release assets: $COUNT / $EXPECTED expected"
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort
          test "$COUNT" -eq "$EXPECTED"

  # ==========================================================================
  # Windows (ucrt64) — the link-unit leg. The staticlibs build and scope
  # (the COFF arscope) and the mingw closure lands; the five binaries wait
  # for the windows exec/lock ports (bootstrap) and the POSIX-oriented
  # spawn/scrub paths (cli), tracked in TODO.v2-1.
  # ==========================================================================
  windows-link-unit:
    name: Windows link-unit (ucrt64)
    permissions:
      contents: write
      # packages:write populates the org's GitHub Packages vcpkg binary
      # cache (ci/vcpkg-nuget-cache.sh).
      packages: write
    runs-on: windows-latest
    needs: prepare
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tebako-rs
      - name: Checkout dwarfs-rs (sibling path dep)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/dwarfs-rs
          path: dwarfs-rs
          submodules: recursive

      - name: Restore the vcpkg baseline (dwarfs-t is the single writer)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Never fails the leg: a miss means the ports build normally.
        # The script owns the canonical root (C:/vcpkg-inst — also the
        # MAX_PATH dodge) and exports DWARFS_RS_VCPKG_INSTALLED_DIR into
        # GITHUB_ENV (the stage step's closure lookup reads it).
        run: |
          bash dwarfs-rs/dwarfs-t/ci/vcpkg-baseline-restore.sh \
            dwarfs-rs/dwarfs-t x64-mingw-static \
            || echo "baseline miss — ports build normally"

      - uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1
        with:
          targets: x86_64-pc-windows-gnu

      # The proven windows-gnu shape (dwarfs-t's green CI + the factory's
      # msys campaign): Git-bash steps + the runner's built-in MinGW +
      # get-cmake, NEVER an msys2 shell or msys2 bin on PATH (vcpkg's own
      # msys2 ABI-clashes with it; the autotools ports die in install).
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      # the stage script is ruby
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgDirectory: ${{ github.workspace }}/.vcpkg-root

      # run-vcpkg@v11 injects VCPKG_BINARY_SOURCES=clear;x-gha,readwrite,
      # and vcpkg removed x-gha (2025.06) — that spec is zero binary cache,
      # and it also neutered the old actions/cache over the archives dir
      # (files provider cleared + archives path redirected). The override
      # is the org's GitHub Packages NuGet feed; the dead cache step is
      # gone (details in ci/vcpkg-nuget-cache.sh).
      - name: Configure the vcpkg binary cache (GitHub Packages NuGet)
        working-directory: tebako-rs
        shell: bash
        env:
          # First-push of a new package id CANNOT be done by GITHUB_TOKEN
          # (GitHub quirk: 403 on creation; community#159893) — the org
          # secret (classic PAT, write:packages) owns creation when present;
          # GITHUB_TOKEN remains the read path and the whole fallback.
          GH_TOKEN: ${{ secrets.TEBAKO_PACKAGES_PAT || secrets.GITHUB_TOKEN }}
        run: bash ci/vcpkg-nuget-cache.sh

      - name: Build the windows-gnu staticlibs (tfs, dwarfs-only)
        working-directory: tebako-rs
        shell: bash
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          # Static-link the mingw C++ runtimes: the runner carries several
          # mingw installs and first-DLL-wins resolution is
          # STATUS_ENTRYPOINT_NOT_FOUND at process start. The trailing
          # -lmsvcrt restores the msvcrt-after-mingwex order invariant
          # (rustc's -nodefaultlibs tail violates it; the factory probe
          # proved libmingwex's compat _assert.o then dies on
          # __imp___msvcrt_assert).
          RUSTFLAGS: -C link-arg=-static-libgcc -C link-arg=-static-libstdc++ -C link-arg=-lmsvcrt
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:$PATH"
          cargo build --release --target x86_64-pc-windows-gnu \
            -p tfs --no-default-features --features vendored-dwarfs \
            -p tebako-driver

      - name: Stage the link unit (scoped, + the mingw closure)
        working-directory: tebako-rs
        shell: bash
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:$PATH"
          mkdir -p out/link-unit-x86_64-windows-gnu
          ruby tools/stage_link_unit out/link-unit-x86_64-windows-gnu \
            --target x86_64-pc-windows-gnu --skip-build
          tar -czf "out/link-unit-${VERSION}-x86_64-windows-gnu.tar.gz" -C out link-unit-x86_64-windows-gnu

      - name: Upload link-unit
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/link-unit-${{ needs.prepare.outputs.version }}-x86_64-windows-gnu.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Windows (ucrt64) — the five binaries. Provisioning mirrors the ci.yml
  # windows-gnu legs (setup-msys2 ucrt64 + the closed PATH, the make
  # toolshim and BOTAN_CONFIGURE_CC for tebako-signer's vendored Botan);
  # all build/stage logic lives in ci/windows-gnu-release.sh. The platform
  # id is windows-ucrt64 per the spec 03 §3 axis (tpkg::Platform owns it).
  # Spec 34: when WINDOWS_SIGNING_ENABLED=true the staged PEs are
  # Authenticode-signed between stage and the ship gate (azure/login OIDC
  # + Azure/artifact-signing-action), signtool-verified (§7.1/§7.2), and
  # the sha/size fragments re-hashed over the SIGNED bytes (sign-then-hash,
  # §1.3). Gate off: the leg ships unsigned, byte-identically to before.
  # ==========================================================================
  windows:
    name: Windows binaries (ucrt64)
    permissions:
      contents: write
      # packages:write populates the org's GitHub Packages vcpkg binary
      # cache (ci/vcpkg-nuget-cache.sh).
      packages: write
      # id-token:write is the spec 34 §3 OIDC boundary — the Entra
      # federated credential issues Azure tokens only to a job of this
      # repo running in the windows-signing environment. The signing
      # steps below are gated on WINDOWS_SIGNING_ENABLED: unsigned runs
      # carry the environment but never request a token.
      id-token: write
    # Spec 34 §5's attestation boundary (see the id-token note above).
    environment: windows-signing
    runs-on: windows-latest
    needs: prepare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tebako-rs
      - name: Checkout dwarfs-rs (sibling path dep)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/dwarfs-rs
          path: dwarfs-rs
          submodules: recursive

      - name: Restore the vcpkg baseline (dwarfs-t is the single writer)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Never fails the leg: a miss means the ports build normally.
        # The script owns the canonical root (C:/vcpkg-inst — also the
        # MAX_PATH dodge) and exports DWARFS_RS_VCPKG_INSTALLED_DIR.
        run: |
          bash dwarfs-rs/dwarfs-t/ci/vcpkg-baseline-restore.sh \
            dwarfs-rs/dwarfs-t x64-mingw-static \
            || echo "baseline miss — ports build normally"

      # cmake + ninja come from the ucrt64 toolchain (the ci.yml
      # windows-gnu legs' proven shape): the script's closed PATH excludes
      # every other bin dir, so get-cmake's paths would be dead.
      - name: Set up MSys2 (ucrt64 toolchain + cmake/ninja)
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: ucrt64
          path-type: minimal
          install: mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-make

      - uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1
        with:
          targets: x86_64-pc-windows-gnu

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgDirectory: ${{ github.workspace }}/.vcpkg-root

      # run-vcpkg@v11 injects VCPKG_BINARY_SOURCES=clear;x-gha,readwrite,
      # and vcpkg removed x-gha (2025.06) — that spec is zero binary cache,
      # and it also neutered the old actions/cache over the archives dir
      # (files provider cleared + archives path redirected). The override
      # is the org's GitHub Packages NuGet feed; the dead cache step is
      # gone (details in ci/vcpkg-nuget-cache.sh).
      - name: Configure the vcpkg binary cache (GitHub Packages NuGet)
        working-directory: tebako-rs
        shell: bash
        env:
          # First-push of a new package id CANNOT be done by GITHUB_TOKEN
          # (GitHub quirk: 403 on creation; community#159893) — the org
          # secret (classic PAT, write:packages) owns creation when present;
          # GITHUB_TOKEN remains the read path and the whole fallback.
          GH_TOKEN: ${{ secrets.TEBAKO_PACKAGES_PAT || secrets.GITHUB_TOKEN }}
        run: bash ci/vcpkg-nuget-cache.sh

      - name: Build + stage the five binaries (release)
        working-directory: tebako-rs
        shell: bash
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: windows-ucrt64
        run: bash ci/windows-gnu-release.sh

      # Spec 34 §4: arm Windows Authenticode signing when the repo
      # variable WINDOWS_SIGNING_ENABLED=true is set (unsigned stays
      # first-class otherwise — spec 00 invariant 7 — and every signing
      # step below skips, shipping byte-identically to the unsigned
      # flow). Armed but any §3 secret/variable absent is a FAST named
      # failure before any signing call, never a partial release (§7.5).
      - name: Arm check — Windows signing (spec 34 §4)
        id: signgate
        working-directory: tebako-rs
        shell: bash
        env:
          WINDOWS_SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENDPOINT: ${{ vars.AZURE_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_SIGNING_CERT_PROFILE: ${{ vars.AZURE_SIGNING_CERT_PROFILE }}
        run: bash ci/windows-sign-gate.sh

      # OIDC workload-identity federation (spec 34 §3): no stored client
      # secret anywhere; the federated credential is scoped to this repo
      # × the windows-signing environment this job runs in.
      - name: Azure login (OIDC, spec 34 §5)
        if: steps.signgate.outputs.armed == 'true'
        uses: azure/login@v2 # TODO(sha-pin): pin on first armed run
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Signs the staged PE artifacts IN PLACE; the re-hash step below
      # re-anchors the fragments to the signed bytes (sign-then-hash,
      # spec 34 §1.3). The account input is `signing-account-name` — spec
      # 34 §5's `trusted-signing-account-name` is the deprecated alias at
      # this action's @v1 (deviation from the spec's draft shape).
      - name: Sign the staged PE artifacts (spec 34 §5)
        if: steps.signgate.outputs.armed == 'true'
        uses: Azure/artifact-signing-action@v1 # TODO(sha-pin): pin on first armed run
        with:
          endpoint: ${{ vars.AZURE_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_CERT_PROFILE }}
          files-folder: tebako-rs/out
          # The enumeration gate (§7.3): everything PE in the staging dir
          # signs by EXTENSION, never a name list — a new tool binary
          # must not ship unsigned by omission.
          files-folder-filter: exe,dll
          file-digest: SHA256
          # §1.4: the RFC 3161 countersignature is mandatory (the action's
          # default timestamp server; set explicitly per spec).
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: tebako toolchain (tamatebako)

      - name: Verify the signatures (spec 34 §7.1/§7.2)
        if: steps.signgate.outputs.armed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # §7.3: enumerate the staged PE set by EXTENSION, never a name
          # list.
          $exes = @(Get-ChildItem -Path 'tebako-rs/out' -Filter '*.exe' -File)
          if ($exes.Count -eq 0) {
            Write-Host "::error::spec 34 §7.3: no staged .exe artifacts under tebako-rs/out"
            exit 1
          }
          # signtool.exe: the action's cached BuildTools first (the
          # TrustedSigning module still owns that directory name at
          # action @v1; the ArtifactSigning spelling is kept as a
          # forward-compat fallback), then the runner image's Windows
          # Kits; newest path first.
          $signtool = @(
            Get-ChildItem -Path "$env:LOCALAPPDATA\TrustedSigning\Microsoft.Windows.SDK.BuildTools" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue
            Get-ChildItem -Path "$env:LOCALAPPDATA\ArtifactSigning\Microsoft.Windows.SDK.BuildTools" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue
            Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue
          ) | Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) {
            Write-Host "::error::spec 34 §7.1: signtool.exe not found (action BuildTools cache and Windows Kits both empty)"
            exit 1
          }
          Write-Host "signtool: $($signtool.FullName)"
          $failed = $false
          foreach ($exe in $exes) {
            Write-Host "== signtool verify /pa /v $($exe.Name)"
            $out = & $signtool.FullName verify /pa /v $exe.FullName 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::spec 34 §7.1: signtool verify /pa FAILED for $($exe.Name)"
              $failed = $true
              continue
            }
            # §7.2/§1.4: the RFC 3161 countersignature is mandatory — an
            # untimestamped signature fails the leg, never a warning.
            if ($out -notmatch 'signature is timestamped' -and $out -notmatch 'RFC ?3161') {
              Write-Host "::error::spec 34 §7.2: no RFC 3161 timestamp countersignature in signtool output for $($exe.Name)"
              $failed = $true
              continue
            }
            $sig = Get-AuthenticodeSignature $exe.FullName
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error::spec 34 §7.1: Get-AuthenticodeSignature status '$($sig.Status)' (not Valid) for $($exe.Name)"
              $failed = $true
              continue
            }
            if ($null -eq $sig.TimeStamperCertificate) {
              Write-Host "::error::spec 34 §7.2: Get-AuthenticodeSignature reports no TimeStamperCertificate for $($exe.Name)"
              $failed = $true
              continue
            }
            Write-Host "signed+timestamped: $($exe.Name) — $($sig.SignerCertificate.Subject)"
          }
          if ($failed) { exit 1 }

      # Spec 34 §1.3 (sign-then-hash): stage.sh hashed the UNSIGNED bytes
      # (Windows signing is a workflow action — it cannot run inside
      # stage.sh the way macos-sign-one.sh does on the macOS legs), so
      # the fragments finalize merges into SHA256SUMS + manifest.json +
      # the .sha256 sidecars MUST be recomputed over the SIGNED bytes.
      # Gate-off runs skip this and keep stage.sh's hashes — byte-
      # identical to today.
      - name: Re-hash the signed binaries (spec 34 §1.3)
        if: steps.signgate.outputs.armed == 'true'
        working-directory: tebako-rs
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: windows-ucrt64
        run: bash ci/windows-sign-refrag.sh

      # The ship gate BEFORE any upload: the PE import audit (the
      # windows-gnu-import-gate delegation — inbox DLLs only;
      # libstdc++-6.dll/libwinpthread-1.dll = FAIL) and the bare-launch
      # smoke with PATH scrubbed to System32+Windows — what a user
      # machine actually looks like (no msys2/ucrt64/Git bin dirs; the
      # 0.1.1 exes only survived because ucrt64/bin sat on the runner's
      # PATH). When the spec 34 gate is armed this runs on the SIGNED
      # exes — the on-platform proof the signed artifacts run.
      - name: Ship gate (clean-PATH smoke + PE import audit)
        working-directory: tebako-rs
        shell: bash
        run: |
          # objdump for the import audit comes from the ucrt64 toolchain
          # (the same closed-PATH root windows-gnu-release.sh uses).
          export PATH="/d/a/_temp/msys64/ucrt64/bin:$PATH"
          bash .github/workflows/lib/ship-gate.sh windows-ucrt64 out/*.exe

      - name: Dump vcpkg build logs on failure
        if: failure()
        shell: bash
        run: |
          for f in .vcpkg-root/buildtrees/*/build-x64-mingw-static-*-err.log .vcpkg-root/buildtrees/*/install-x64-mingw-static-*-err.log; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            tail -200 "$f"
          done

      - name: Upload fragment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frag-windows-ucrt64
          path: tebako-rs/fragments/frag-windows-ucrt64

      - name: Upload tebako-bootstrap
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-bootstrap-${{ needs.prepare.outputs.version }}-windows-ucrt64.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tfs
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tfs-${{ needs.prepare.outputs.version }}-windows-ucrt64.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako-pkg
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-pkg-${{ needs.prepare.outputs.version }}-windows-ucrt64.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-${{ needs.prepare.outputs.version }}-windows-ucrt64.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako-shim
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-shim-${{ needs.prepare.outputs.version }}-windows-ucrt64.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tebako-runtime-launcher
        if: needs.prepare.outputs.upload_url != ''
        run: gh release upload "${{ needs.prepare.outputs.tag_name }}" "tebako-rs/out/tebako-runtime-launcher-${{ needs.prepare.outputs.version }}-windows-ucrt64.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
