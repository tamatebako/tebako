name: deploy-probe
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: List the env image (errors visible)
        shell: bash
        run: |
          set -uo pipefail
          devkit_ucrt="$(cygpath "$RI_DEVKIT")/ucrt64/bin"
          export PATH="$devkit_ucrt:$PATH"
          base="https://github.com/tamatebako/tebako/releases/download/v2.8.38"
          mkdir -p tools && cd tools
          curl -fsSLO "$base/tebako-2.8.38-windows-ucrt64.exe" && curl -fsSLO "$base/tfs-2.8.38-windows-ucrt64.exe"
          mv tebako-2.8.38-windows-ucrt64.exe tebako.exe && mv tfs-2.8.38-windows-ucrt64.exe tfs.exe
          cd ..
          mkdir -p app && cd app
          printf 'puts "hello"\n' > main.rb
          ../tools/tebako.exe press --root . --entry-point main.rb --Ruby 3.4.10 --mode self-contained --output dist/app > press.out 2>&1 || true
          RT="$LOCALAPPDATA/tebako/runtimes/ruby-3.4.10-0.16.32-windows-ucrt64"
          ENVIMG="$RT.tfs"
          echo "==== tfs ls errors? ===="
          ../tools/tfs.exe ls "$ENVIMG" 2>&1 | head -5
          echo "==== full ls | link-relevant ===="
          ../tools/tfs.exe ls "$ENVIMG" 2>/dev/null | grep -iE "lib/|\.a$|\.dll" > /tmp/envls.txt; head -30 /tmp/envls.txt
          echo "==== count ===="; wc -l /tmp/envls.txt
