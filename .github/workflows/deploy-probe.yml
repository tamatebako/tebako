name: deploy-probe
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Press + dissect BOTH manifests the child sees
        shell: bash
        run: |
          set -euo pipefail
          devkit_ucrt="$(cygpath "$RI_DEVKIT")/ucrt64/bin"
          export PATH="$devkit_ucrt:$PATH"
          base="https://github.com/tamatebako/tebako/releases/download/v2.8.37"
          mkdir -p tools && cd tools
          curl -fsSLO "$base/tebako-2.8.37-windows-ucrt64.exe"
          curl -fsSLO "$base/tfs-2.8.37-windows-ucrt64.exe"
          curl -fsSLO "$base/SHA256SUMS"
          grep -E "tebako-2.8.37-windows-ucrt64.exe$|tfs-2.8.37-windows-ucrt64.exe$" SHA256SUMS | sha256sum -c -
          mv tebako-2.8.37-windows-ucrt64.exe tebako.exe
          mv tfs-2.8.37-windows-ucrt64.exe tfs.exe
          cd ..
          mkdir -p app && cd app
          printf 'source "https://rubygems.org"\ngem "nio4r", "2.7.5"\n' > Gemfile
          printf 'puts "hello"\n' > main.rb
          set +e
          ../tools/tebako.exe press --root . --entry-point main.rb --Ruby 3.4.10 --mode self-contained --output dist/app > press.out 2>&1
          rc=$?
          set -e
          echo "press rc=$rc"
          P="$USERPROFILE/.tebako/o/p"
          echo "---- o/p full listing ----"
          ls -la "$P/"
          echo "---- deploy-driver.tfs top-level content ----"
          ../tools/tfs.exe ls "$P/deploy-driver.tfs" | head -20
          echo "---- deploy image __tpkg__ entries? ----"
          ../tools/tfs.exe ls "$P/deploy-driver.tfs" | grep -c "__tpkg__" || echo "0 __tpkg__ entries"
          echo "---- env image manifest identity ----"
          ENVIMG="$LOCALAPPDATA/tebako/runtimes/ruby-3.4.10-0.16.32-windows-ucrt64/tebako-runtime-0.16.32-3.4.10-windows-ucrt64.tfs"
          ../tools/tfs.exe cat "$ENVIMG" __tpkg__/manifest.yaml 2>/dev/null | head -30
          echo "---- deploy image manifest (if any) ----"
          ../tools/tfs.exe cat "$P/deploy-driver.tfs" __tpkg__/manifest.yaml 2>&1 | head -30
