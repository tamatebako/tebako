name: deploy-probe
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: The extracted staging's link surface
        shell: bash
        run: |
          set -uo pipefail
          devkit_ucrt="$(cygpath "$RI_DEVKIT")/ucrt64/bin"
          export PATH="$devkit_ucrt:$PATH"
          base="https://github.com/tamatebako/tebako/releases/download/v2.8.38"
          mkdir -p tools && cd tools
          curl -fsSLO "$base/tebako-2.8.38-windows-ucrt64.exe"
          mv tebako-2.8.38-windows-ucrt64.exe tebako.exe
          cd ..
          mkdir -p app && cd app
          printf 'puts "hello"\n' > main.rb
          ../tools/tebako.exe press --root . --entry-point main.rb --Ruby 3.4.10 --mode self-contained --output dist/app > press.out 2>&1 || true
          S="$USERPROFILE/.tebako/o/s"
          echo "==== staging lib/ (.a/.dll) ===="
          find "$S/lib" -maxdepth 2 \( -name "*.a" -o -name "*.dll" \) 2>/dev/null | head -15
          echo "==== staging bin/ ===="
          find "$S/bin" -maxdepth 1 2>/dev/null | head -8
          echo "==== staging root ===="
          ls "$S" | head -12
          echo "==== SDK lib/ (the stub) ===="
          find "$USERPROFILE/.tebako/deps/sdk" -name "*.a" 2>/dev/null | head -5
          nm "$(find "$USERPROFILE/.tebako/deps/sdk" -name "libruby-stub.a" 2>/dev/null | head -1)" 2>/dev/null | grep -c " T " || echo "stub unreadable"
          nm "$(find "$USERPROFILE/.tebako/deps/sdk" -name "libruby-stub.a" 2>/dev/null | head -1)" 2>/dev/null | grep -m2 "__imp_" || echo "no __imp_ symbols in stub"
