name: deploy-probe
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Build date_core.so + name the missing procedure
        shell: bash
        run: |
          set -uo pipefail
          devkit_ucrt="$(cygpath "$RI_DEVKIT")/ucrt64/bin"
          export PATH="$devkit_ucrt:$PATH"
          base="https://github.com/tamatebako/tebako/releases/download/v2.8.43"
          mkdir -p tools && cd tools
          curl -fsSLO "$base/tebako-2.8.43-windows-ucrt64.exe" && curl -fsSLO "$base/SHA256SUMS"
          grep "tebako-2.8.43-windows-ucrt64.exe\$" SHA256SUMS | sha256sum -c -
          mv tebako-2.8.43-windows-ucrt64.exe tebako.exe
          cd ..
          mkdir -p app && cd app
          printf 'source "https://rubygems.org"\ngem "date"\n' > Gemfile
          printf 'puts "hello"\n' > main.rb
          ../tools/tebako.exe press --root . --entry-point main.rb --Ruby 3.4.10 --mode self-contained --output dist/app > press.out 2>&1
          echo "press rc=$?"
          grep -iE "error|failed" press.out | head -3
          SO=$(find "$USERPROFILE/.tebako/o/s" -name "date_core.so" 2>/dev/null | head -1)
          echo "so: $SO"
          DLL="$LOCALAPPDATA/tebako/runtimes/ruby-3.4.10-0.16.32-windows-ucrt64/x64-ucrt-ruby340.dll"
          ls -la "$DLL" 2>/dev/null || echo "DLL NOT materialized beside exe"
          echo "==== the .so's import tables ===="
          objdump -p "$SO" 2>/dev/null | grep -A4 "DLL Name" | head -20
          echo "==== symbols the .so imports from the ruby DLL ===="
          objdump -p "$SO" 2>/dev/null | sed -n '/DLL Name: x64-ucrt-ruby340/,/^$/p' | head -30
