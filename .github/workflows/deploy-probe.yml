name: deploy-probe
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Reproduce the child + isolate the ambiguity
        shell: bash
        run: |
          set -euo pipefail
          devkit_ucrt="$(cygpath "$RI_DEVKIT")/ucrt64/bin"
          export PATH="$devkit_ucrt:$PATH"
          base="https://github.com/tamatebako/tebako/releases/download/v2.8.37"
          mkdir -p tools && cd tools
          curl -fsSLO "$base/tebako-2.8.37-windows-ucrt64.exe" && curl -fsSLO "$base/SHA256SUMS"
          grep "tebako-2.8.37-windows-ucrt64.exe\$" SHA256SUMS | sha256sum -c -
          mv tebako-2.8.37-windows-ucrt64.exe tebako.exe
          cd ..
          mkdir -p app && cd app
          printf 'source "https://rubygems.org"\ngem "nio4r", "2.7.5"\n' > Gemfile
          printf 'puts "hello"\n' > main.rb
          set +e
          ../tools/tebako.exe press --root . --entry-point main.rb --Ruby 3.4.10 --mode self-contained --output dist/app > press.out 2>&1
          echo "press rc=$?"
          set -e
          P="$USERPROFILE/.tebako/o/p"
          RT="$LOCALAPPDATA/tebako/runtimes/ruby-3.4.10-0.16.32-windows-ucrt64/tebako-runtime-0.16.32-3.4.10-windows-ucrt64"
          ENVIMG="$RT.tfs"
          export TEBAKO_RUNTIME_IMAGE="$ENVIMG"
          export TEBAKO_TRACE=1
          export MSYS2_ARG_CONV_EXCL="*"
          echo "==== child replica: ruby.exe -e puts ===="
          set +e
          "$P/ruby.exe" -e 'puts "CHILD OK"' 2>&1 | head -8
          echo "==== driver-direct: the runtime exe + deploy pkg (no bootstrap) ===="
          "$RT" --tebako-image "$P/deploy-driver.pkg:0:/t" --tebako-entry /local/stub.rb -e 'puts "DIRECT OK"' 2>&1 | head -8
          echo "==== driver with NO payload image (env only) ===="
          "$RT" --tebako-entry /local/stub.rb -e 'puts "ENVONLY OK"' 2>&1 | head -8
          set -e
          echo "==== the deploy pkg's trailer info (does IT embed a manifest?) ===="
          ../tools/tfs.exe --version 2>/dev/null || true
          # dump the deploy-driver.pkg's L2 manifest via strings
          strings "$P/deploy-driver.pkg" 2>/dev/null | grep -iE "library_alias|libwinpthread|tebako-deploy" | head -10 || echo "no alias strings in pkg"
          strings "$P/ruby.exe" 2>/dev/null | grep -iE "libwinpthread|tebako-deploy-ruby" | head -6 || echo "no alias strings in ruby.exe"
