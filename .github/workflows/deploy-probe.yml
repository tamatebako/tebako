name: deploy-probe
# The five-minute diagnosis instrument (tebako#753's proven pattern):
# each scenario presses real bytes through the pinned toolchain on a
# live Windows runner and prints the evidence a release-cycle
# diagnosis would have taken hours to surface. Dispatch-only — never
# push-triggered (a probe is a deliberate experiment, and the template
# library under tools/probes/ is reviewed like any other code).
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'The probe to run'
        required: true
        type: choice
        options:
          - press-gem
          - dissect-sdk
          - child-boot
      tool_ref:
        description: 'The tebako release tag to press with (default v2.8.44)'
        required: false
        type: string
      gem:
        description: 'press-gem only: the gem to press (default nio4r)'
        required: false
        type: string
      gem_version:
        description: 'press-gem only: an optional version pin'
        required: false
        type: string

concurrency:
  group: deploy-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Run the probe
        shell: bash
        env:
          PROBE_REL: ${{ inputs.tool_ref || 'v2.8.44' }}
          PROBE_GEM: ${{ inputs.gem || 'nio4r' }}
          PROBE_GEM_VER: ${{ inputs.gem_version || '' }}
        run: bash "tools/probes/${{ inputs.scenario }}.sh"
