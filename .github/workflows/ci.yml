name: CI

on:
  push:
    branches: [main, feat/*]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Must match the builtin-baseline in dwarfs-t/vcpkg.json (mirrors
  # dwarfs-t's and dwarfs-rs's CI; the vendored dwarfs build needs vcpkg).
  VCPKG_COMMIT: f14401ca0f2754347c3864da7488a9b955b4e47a

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          # The dwarfs backend's path dependency (../dwarfs-rs) brings the
          # dwarfs-t submodule with it.
          submodules: recursive
          path: tebako-rs

      # dwarfs-rs is a sibling path dependency until it has a release.
      - name: Checkout dwarfs-rs (sibling path dep)
        uses: actions/checkout@v4
        with:
          repository: tamatebako/dwarfs-rs
          path: dwarfs-rs
          submodules: recursive

      - name: Install toolchain (rustup)
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy

      - name: Install native build tools (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            autoconf automake autoconf-archive libtool \
            curl zip unzip tar ca-certificates

      - name: Install native build tools (macos)
        if: runner.os == 'macOS'
        run: brew install ninja autoconf automake autoconf-archive libtool

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgDirectory: ${{ github.workspace }}/.vcpkg-root

      - name: Cache vcpkg package archives
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg
            ~/Library/Caches/vcpkg
          key: vcpkg-archives-${{ runner.os }}-${{ hashFiles('dwarfs-rs/dwarfs-t/vcpkg.json', 'dwarfs-rs/dwarfs-t/vcpkg_ports/**', 'dwarfs-rs/dwarfs-t/vcpkg_triplets/**', 'tebako-rs/crates/sqfs-sys/vcpkg.json', 'tebako-rs/crates/sqfs-sys/vcpkg_ports/**', 'tebako-rs/crates/sqfs-sys/vcpkg_triplets/**') }}
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-

      # Pre-install libsquashfs & co in a serialized step: sqfs-sys's
      # build.rs would otherwise race dwarfs-t-sys's CMake-driven vcpkg run
      # on the vcpkg-root filesystem lock (held ~45 min on a cold cache).
      - name: Pre-install squashfs-tools-ng (serialized)
        working-directory: tebako-rs
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then TRIPLET=x64-linux-static; else TRIPLET=arm64-osx-static; fi
          ../.vcpkg-root/vcpkg install \
            --vcpkg-root "${{ github.workspace }}/.vcpkg-root" \
            --x-wait-for-lock \
            --x-manifest-root crates/sqfs-sys \
            --x-install-root "${{ github.workspace }}/.sqfs-installed" \
            --triplet "$TRIPLET" \
            --overlay-triplets crates/sqfs-sys/vcpkg_triplets \
            --overlay-ports crates/sqfs-sys/vcpkg_ports
          echo "SQFS_SYS_VCPKG_INSTALLED_DIR=${{ github.workspace }}/.sqfs-installed/$TRIPLET" >> "$GITHUB_ENV"

      # The tebako-pkg golden suite compares against the C++ tebakofs
      # oracle, and tfs-cli's mkimage against mkdwarfs; use the libtfs
      # release binaries for the runner's platform.
      - name: Download the C++ oracle binaries (libtfs release)
        run: |
          mkdir -p .oracle
          if [ "${{ runner.os }}" = "Linux" ]; then
            TEBAKOFS=tebakofs-linux-gnu-x86_64
            MKDWARFS=mkdwarfs-linux-gnu-x86_64
            BOOTSTRAP=tebako-bootstrap-0.2.0-linux-gnu-x86_64
          else
            TEBAKOFS=tebakofs-macos-arm64
            MKDWARFS=mkdwarfs-macos-arm64
            BOOTSTRAP=tebako-bootstrap-0.2.0-macos-arm64
          fi
          curl -fsSL -o .oracle/tebakofs \
            "https://github.com/tamatebako/libtfs/releases/download/v0.13.0/$TEBAKOFS"
          curl -fsSL -o .oracle/mkdwarfs \
            "https://github.com/tamatebako/libtfs/releases/download/v0.13.0/$MKDWARFS"
          curl -fsSL -o .oracle/tebako-bootstrap \
            "https://github.com/tamatebako/tebako-bootstrap/releases/download/v0.2.0/$BOOTSTRAP"
          chmod +x .oracle/tebakofs .oracle/mkdwarfs .oracle/tebako-bootstrap
          echo "TEBAKOFS_CPP=${{ github.workspace }}/.oracle/tebakofs" >> "$GITHUB_ENV"
          echo "TEBAKO_MKDWARFS=${{ github.workspace }}/.oracle/mkdwarfs" >> "$GITHUB_ENV"
          echo "TEBAKO_CPP_BOOTSTRAP=${{ github.workspace }}/.oracle/tebako-bootstrap" >> "$GITHUB_ENV"

      # item 22's hard gate: the Rust bootstrap must stay under 2 MB
      # absolute. Publishes the table and fails the job when over.
      - name: Bootstrap size gate (< 2 MB)
        working-directory: tebako-rs
        run: |
          cargo build -p tebako-bootstrap --release
          SIZE=$(stat -c %s target/release/tebako-bootstrap 2>/dev/null || stat -f %z target/release/tebako-bootstrap)
          CPP_SIZE=$(stat -c %s ../.oracle/tebako-bootstrap 2>/dev/null || stat -f %z ../.oracle/tebako-bootstrap)
          echo "| platform | Rust bootstrap | C++ v0.2.0 | budget |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ${{ runner.os }} | $SIZE B | $CPP_SIZE B | < 2 MB |" >> "$GITHUB_STEP_SUMMARY"
          echo "tebako-bootstrap: $SIZE bytes (budget 2097152)"
          test "$SIZE" -lt 2097152

      # `cargo build` first: it produces the libtfs cdylib the C harness
      # links against (cargo test alone builds deps as rlibs only).
      - name: cargo build
        working-directory: tebako-rs
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
        run: cargo build --workspace

      - name: cargo test
        working-directory: tebako-rs
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
        run: cargo test --workspace

      - name: clippy
        working-directory: tebako-rs
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-pure-cargo:
    name: test (--no-default-features, ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: tebako-rs

      # tfs's optional dwarfs-t path dependency must resolve even with the
      # feature off, so the sibling checkout is still required.
      - name: Checkout dwarfs-rs (sibling path dep)
        uses: actions/checkout@v4
        with:
          repository: tamatebako/dwarfs-rs
          path: dwarfs-rs
          submodules: recursive

      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
      # The no-dwarfs configuration must stay buildable and testable
      # without any vcpkg involvement (dwarfs mounts then fail ENOTSUP).
      - name: cargo test (no default features)
        working-directory: tebako-rs
        run: cargo test -p tfs --no-default-features

  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: tebako-rs

      # cargo fmt resolves the workspace; tfs's optional dwarfs-t path
      # dependency must exist (manifests only — no submodules needed).
      - name: Checkout dwarfs-rs (sibling path dep)
        uses: actions/checkout@v4
        with:
          repository: tamatebako/dwarfs-rs
          path: dwarfs-rs

      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        working-directory: tebako-rs
