name: Debug — ubuntu double-free (tebako-pkg info)

# One-off diagnostic: #350's `tebako-pkg --test info` aborts with
# "double free or corruption" on ubuntu CI only (macOS green, 13/13 local
# green). Runs the exact test under valgrind on the warm vcpkg cache.
# Delete this workflow once the root cause is fixed.

on:
  push:
    branches: [debug/**]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  VCPKG_COMMIT: f14401ca0f2754347c3864da7488a9b955b4e47a

jobs:
  valgrind:
    name: valgrind tebako-pkg --test info (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: tebako-rs

      - name: Checkout dwarfs-rs (sibling path dep)
        uses: actions/checkout@v4
        with:
          repository: tamatebako/dwarfs-rs
          path: dwarfs-rs
          submodules: recursive

      - uses: dtolnay/rust-toolchain@1.94.1

      - name: Install native build tools + valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            autoconf automake autoconf-archive libtool \
            curl zip unzip tar ca-certificates \
            valgrind

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgDirectory: ${{ github.workspace }}/.vcpkg-root

      - name: Cache vcpkg package archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-archives-${{ runner.os }}-${{ hashFiles('dwarfs-rs/dwarfs-t/vcpkg.json', 'dwarfs-rs/dwarfs-t/vcpkg_ports/**', 'dwarfs-rs/dwarfs-t/vcpkg_triplets/**', 'tebako-rs/crates/sqfs-sys/vcpkg.json', 'tebako-rs/crates/sqfs-sys/vcpkg_ports/**', 'tebako-rs/crates/sqfs-sys/vcpkg_triplets/**') }}
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-

      - name: Pre-install squashfs-tools-ng (serialized)
        working-directory: tebako-rs
        run: |
          ../.vcpkg-root/vcpkg install \
            --vcpkg-root "${{ github.workspace }}/.vcpkg-root" \
            --x-wait-for-lock \
            --x-manifest-root crates/sqfs-sys \
            --x-install-root "${{ github.workspace }}/.sqfs-installed" \
            --triplet x64-linux-static \
            --overlay-triplets crates/sqfs-sys/vcpkg_triplets \
            --overlay-ports crates/sqfs-sys/vcpkg_ports
          echo "SQFS_SYS_VCPKG_INSTALLED_DIR=${{ github.workspace }}/.sqfs-installed/x64-linux-static" >> "$GITHUB_ENV"

      # rnp-rs 0.1.7 prebuilt declares botan/bz2 external; provision BOTH
      # statically in a dir of their own (ld prefers .so over .a in a
      # shared dir). Absolute paths only — relative ones broke main.
      - name: Static botan + bzip2 (vcpkg)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.crypto-static"
          "$GITHUB_WORKSPACE/.vcpkg-root/vcpkg" install botan bzip2 \
            --vcpkg-root "$GITHUB_WORKSPACE/.vcpkg-root" \
            --x-wait-for-lock \
            --x-install-root "$GITHUB_WORKSPACE/.crypto-vcpkg" \
            --triplet x64-linux-static \
            --overlay-triplets tebako-rs/crates/sqfs-sys/vcpkg_triplets
          cp "$GITHUB_WORKSPACE/.crypto-vcpkg/x64-linux-static/lib/libbotan-3.a" \
             "$GITHUB_WORKSPACE/.crypto-vcpkg/x64-linux-static/lib/libbz2.a" \
             "$GITHUB_WORKSPACE/.crypto-static/"
          echo "RUSTFLAGS=-L $GITHUB_WORKSPACE/.crypto-static" >> "$GITHUB_ENV"

      - name: Build the info test
        working-directory: tebako-rs
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          # feat/encryption pins rnp to a git rev → librnp builds from the
          # vendored submodule via cmake → FindBZip2/FindBotan need the
          # vcpkg-installed static deps visible.
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/.crypto-vcpkg/x64-linux-static
          PKG_CONFIG_PATH: ${{ github.workspace }}/.crypto-vcpkg/x64-linux-static/lib/pkgconfig
        run: cargo test -p tebako-pkg --test info --no-run

      - name: Run under valgrind
        working-directory: tebako-rs
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
        run: |
          BIN=$(ls -t target/debug/deps/info-* | grep -v '\.d$' | head -1)
          echo "test binary: $BIN"
          set +e
          valgrind \
            --error-exitcode=99 \
            --track-origins=yes \
            --num-callers=40 \
            --log-file=valgrind.log \
            "$BIN" --test-threads=1 --nocapture
          echo "valgrind exit: $?"
          echo "=== valgrind.log tail ==="
          tail -80 valgrind.log

      - name: Upload valgrind log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-info-ubuntu
          path: tebako-rs/valgrind.log
