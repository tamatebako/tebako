name: 'Test: package metanorma'
description: 'Test: package metanorma'
runs:
  using: "composite"
  steps:
    - name: Checkout packed-mn
      uses: actions/checkout@v4
      with:
        repository: metanorma/packed-mn
        path: ${{github.workspace}}/packed-mn

    # metanorma builds emf2svg from source (mini_portile/cmake + vcpkg
    # manifest mode); vcpkg needs zip/unzip for its archives, the gperf
    # port (fontconfig host tool) autoreconfs with the system autotools
    # chain, and fontconfig's meson setup needs python distutils. The dev
    # containers and the macOS runner image lack autoconf-archive (and
    # zip/unzip/python3-distutils on Linux).
    - name: Install emf2svg build dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq
          apt-get install -y -qq zip unzip autoconf autoconf-archive automake libtool curl python3-distutils
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache zip unzip autoconf autoconf-archive automake libtool curl
        fi
        # gperf 3.3 requires autoconf >= 2.70 to autoreconf; ubuntu-20.04
        # ships 2.69, so build a newer autoconf from source there
        if autoconf --version | awk 'NR==1 { exit !($NF+0 < 2.70) }'; then
          curl -sSL https://ftpmirror.gnu.org/gnu/autoconf/autoconf-2.72.tar.gz | tar xz
          (cd autoconf-2.72 && ./configure --prefix=/usr/local >/dev/null && make -j"$(nproc)" >/dev/null && make install >/dev/null)
        fi

    - name: Install emf2svg build dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install autoconf autoconf-archive automake libtool

    # The prebuilt-runtime press flow needs the packaging environment
    # (ruby stash + mkdwarfs); the deps cache only carries .tebako/deps and
    # misses on every release (tebako hash changes). Build the env here.
    # ('tebako setup' has no --Ruby option; press pins the version below.)
    - name: Setup tebako environment
      shell: bash
      run: tebako setup --prefix='.tebako'

    - name: Package metanorma
      shell: bash
      run: tebako press --root=packed-mn --entry-point=bin/metanorma --output=metanorma-package --Ruby=${{ matrix.package_ruby_ver }} --prefix='.tebako'

    - name: Run smoke test
      shell: bash
      run: ./metanorma-package help
