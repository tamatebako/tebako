name: 'Setup test matrix'
description: 'Emits the tiered test matrix (ruby lines x environments) for tebako press tests'

inputs:
  matrix-file:
    description: 'Path to the matrix configuration JSON file'
    required: true
    type: string
  event-name:
    description: 'GitHub event name'
    required: true
    type: string

outputs:
  ruby-matrix:
    description: 'Ruby versions matrix configuration'
    value: ${{ steps.set-matrix.outputs.ruby-matrix }}
  env-matrix:
    description: 'Environment matrix configuration'
    value: ${{ steps.set-matrix.outputs.env-matrix }}

runs:
  using: "composite"
  steps:
    - name: Read test matrix from file
      id: set-matrix
      shell: bash
      run: |
        # Tiered version coverage (TODO.restructure/08, locked 2026-07-25):
        #   push / pull_request        -> "gate": boundary lines x tier-1 envs
        #   schedule / workflow_dispatch -> "full": full line set x all envs
        case "${{ inputs.event-name }}" in
          schedule | workflow_dispatch)
            tier="full"
            ;;
          *)
            tier="gate"
            ;;
        esac

        ruby=$(jq -c ".$tier.ruby" ${{ inputs.matrix-file }})
        env=$(jq -c ".$tier.env" ${{ inputs.matrix-file }})

        echo "Selected '$tier' tier for event '${{ inputs.event-name }}': ruby=$ruby env=$env"

        echo "ruby-matrix=$ruby" >> $GITHUB_OUTPUT
        echo "env-matrix=$env" >> $GITHUB_OUTPUT
