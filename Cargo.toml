[workspace]
resolver = "2"

members = ["crates/tpkg", "crates/tfs", "crates/sqfs-sys", "crates/tebako-pkg", "crates/tfs-cli", "crates/tebako-bootstrap", "crates/tebako-cli", "crates/tebako-http", "crates/tebako-signer", "crates/tebako-shim", "crates/tebako-json", "crates/tebako-resolve", "crates/tebako-term", "crates/tebako-info", "crates/libtfs-preload", "tests/contract"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "BSD-2-Clause"
repository = "https://github.com/tamatebako/tebako"
homepage = "https://github.com/tamatebako/tebako"

[profile.release]
# Size discipline for the tebako-bootstrap artifact (item 22's < 2 MB
# absolute budget): minimal size, full LTO, abort on panic, stripped.
# Dev/test profiles are unaffected (the workspace test suite runs in dev).
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"


# WORKAROUND (upstream rnpgp/rnp-rs#63): rnp-src 0.1.1's is_packaging()
# heuristic misfires for every crates.io consumer — the registry
# extraction always contains Cargo.toml.orig, so `vendored` emits empty
# lib/include dirs. A git checkout has no Cargo.toml.orig and builds for
# real. Pin rnp-src to the identical git tag until a fixed 0.1.x ships,
# then DELETE this section.
[patch.crates-io]
rnp-src = { git = "https://github.com/rnpgp/rnp-rs.git", tag = "rnp-src-v0.1.1" }
