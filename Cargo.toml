[workspace]
resolver = "2"
members = ["crates/tpkg", "crates/tfs", "crates/sqfs-sys", "crates/tebako-pkg", "crates/tfs-cli", "crates/tebako-bootstrap", "crates/tebako-cli", "crates/tebako-http", "tests/contract"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "BSD-2-Clause"
repository = "https://github.com/tamatebako/tebako-rs"
homepage = "https://github.com/tamatebako/tebako-rs"

[profile.release]
# Size discipline for the tebako-bootstrap artifact (item 22's < 2 MB
# absolute budget): minimal size, full LTO, abort on panic, stripped.
# Dev/test profiles are unaffected (the workspace test suite runs in dev).
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
