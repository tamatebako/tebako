[workspace]
resolver = "2"

members = ["crates/tpkg", "crates/tfs", "crates/sqfs-sys", "crates/tebako-pkg", "crates/tfs-cli", "crates/tebako-bootstrap", "crates/tebako-cli", "crates/tebako-http", "crates/tebako-signer", "crates/tebako-shim", "crates/tebako-json", "crates/tebako-resolve", "crates/tebako-term", "crates/tebako-info", "crates/libtfs-preload", "crates/tebako-driver", "crates/tebako-runtime-launcher", "crates/tebako-arscope", "crates/tebako-bench", "tests/contract"]

[workspace.package]
version = "2.8.12"
edition = "2021"
rust-version = "1.79"
license = "BSD-2-Clause"
repository = "https://github.com/tamatebako/tebako"
homepage = "https://github.com/tamatebako/tebako"

[profile.release]
# Size discipline for the tebako-bootstrap artifact (item 22's < 2 MB
# absolute budget): minimal size, full LTO, abort on panic, stripped.
# Dev/test profiles are unaffected (the workspace test suite runs in dev).
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# windows-arm64 phase 1 (roadmap 02 Gap 1): rnp-src 0.3.0 stomps a
# caller-provided BOTAN_CONFIGURE_CC on every windows host, which makes
# the MSVC x64_arm64 cross build of the signer-linked tools impossible.
# The fork branch carries the caller-respect guard (rnpgp/rnp-rs#103);
# behavior is identical on every target that sets nothing. Drop this pin
# when the upstream release carries the fix.
[patch.crates-io]
rnp-src = { git = "https://github.com/tamatebako/rnp-rs", branch = "fix/windows-cc-override" }
