[workspace]
resolver = "2"

members = ["crates/tpkg", "crates/tfs", "crates/sqfs-sys", "crates/tebako-pkg", "crates/tfs-cli", "crates/tebako-bootstrap", "crates/tebako-cli", "crates/tebako-http", "crates/tebako-signer", "crates/tebako-shim", "crates/tebako-json", "crates/tebako-resolve", "crates/tebako-term", "crates/tebako-info", "crates/libtfs-preload", "crates/tebako-driver", "crates/tebako-arscope", "crates/tebako-bench", "tests/contract"]

[workspace.package]
version = "0.3.4"
edition = "2021"
rust-version = "1.79"
license = "BSD-2-Clause"
repository = "https://github.com/tamatebako/tebako"
homepage = "https://github.com/tamatebako/tebako"

[profile.release]
# Size discipline for the tebako-bootstrap artifact (item 22's < 2 MB
# absolute budget): minimal size, full LTO, abort on panic, stripped.
# Dev/test profiles are unaffected (the workspace test suite runs in dev).
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
