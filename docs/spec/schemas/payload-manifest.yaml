# =============================================================================
# payload-manifest.yaml — the L1 in-image payload manifest grammar
# (spec 18 §2.2; spec 03 §1–§5 formalized)
#
# The self-description every payload carries at /__tpkg__/manifest.yaml:
# IDENTITY + PROVIDES + DEPENDS on a common provenance/trust layer. This
# file formalizes the CURRENT shape (crates/tpkg/src/manifest.rs, the
# implementation of record) as schema_version 1 — plus the spec-18
# contract field identity.era. It is a declaration of what exists, not a
# redesign.
#
# SSOT: this file owns the grammar; crates/tpkg/src/manifest.rs (the
# serde model + validators) mirrors it — keep the two in sync in the same
# PR. The versioned JSON Schema the code comments reference
# (schema/tpkg-manifest-v1.schema.json) is generated FROM this file when
# the JSON-Schema pipeline lands (spec 18 §3.9).
# =============================================================================

schema: payload-manifest
schema_version: 1 # MAJOR — breaking changes only
schema_minor: 5 # MINOR — additive changes only (1: materialize, 2: library_aliases, 3: checks, 4: requires kind runtime, 5: requires kind executable + expose)
status: normative
owner: crates/tpkg (the model) in tamatebako/tebako
edge: C7 (driver → payload images), C10 (executable payload → runtime), C11 (feature payload → consumers)

# The schema evolution law (spec 18 §3) — every schema in this registry
# obeys it; per-schema specializations are noted under `notes:`.
evolution:
  major_minor: >-
    schema_version is a single integer MAJOR; schema_minor an additive
    counter. MAJOR breaks, MINOR adds.
  unknown_fields: >-
    Readers ignore unknown fields within their MAJOR — but never invent
    semantics for them. A field you do not understand changes nothing you do.
    (Here: tolerated at every section level; only identity.annotations is
    guaranteed lossless on round-trip.)
  unknown_major: >-
    A named refusal naming the artifact, its schema + version, the consumer
    and its max spoken version, and "upgrade". Exit code per spec 18 §7.
  missing_schema_version: >-
    Era 1 — a named refusal ("pre-era document; regenerate with a current
    tool"), never a silent default. (Here: identity.schema_version.)
  type_changes: >-
    MAJOR only — no silent coercion (string→list, int→string, kebab→snake).
    Renames ride the deprecation window.
  deprecation_window: >-
    To rename/retype a field inside one MAJOR: writers emit BOTH old and
    new for two consecutive MINOR versions (noted under `deprecated:` with
    the window dates); readers prefer new and warn on old; after two MINORs
    the old field is dropped in the next MINOR.
  critical_flag: >-
    Any container that skips unknown entries supports `critical: true` on
    an entry: a reader that does not understand a critical entry refuses
    with a named error instead of skipping it (spec 18 §3.7). Applies to
    provides/requires entries.
  lists_stay_lists: >-
    Ordered/multiplicity data is a list of entries carrying their identity
    fields — never keyed maps. (Here: entrypoints, requires, executables,
    libraries, encryption parts.)

declaration:
  where: /__tpkg__/manifest.yaml inside every payload image
  format: YAML (authored-manifest rule, invariant 6)

grammar:
  identity:
    type: map
    required: true
    fields:
      schema_version: {type: int, required: true, notes: this schema's MAJOR}
      era:
        type: int
        required: false
        notes: >-
          The spec-18 contract field: the payload's declared era (>= 2
          once declared). Absent = era 1 (pre-era payload) — consumers
          that require the contract refuse by name (spec 18 §2.2).
      kind: {type: enum, values: [app, data, toolkit, runtime, language], required: true}
      name: {type: string, required: true}
      version: {type: string, required: true, notes: free-form (semver AND datever exist)}
      producer:
        type: map
        required: true
        fields:
          tool: {type: string, required: true}
          tool_version: {type: string, required: true}
      created: {type: string, required: true, notes: RFC 3339 rendering; the model does not interpret time}
      source:
        type: map
        required: false
        fields:
          src_sha256: {type: string, required: false, notes: 64 lowercase hex}
          commit: {type: string, required: false}
          builder: {type: string, required: false}
        notes: at least one digest/id required when the block is present
      sbom:
        type: map
        required: false
        fields:
          ref: {type: string, required: true}
      digest:
        type: map
        required: true
        fields:
          tree_hash:
            type: string
            required: true
            notes: "\"<algorithm>:<64 lowercase hex>\" — the manifest-excluded merkle root (tfs-merkle-1), the CAS identity"
          blob_sha256:
            type: string
            required: true
            notes: 64 lowercase hex — advisory provenance only in an embedded manifest (spec 03 §7 fixed-point rule)
      signing:
        type: map
        required: true
        fields:
          state: {type: enum, values: [unsigned, signed], required: true}
          keyid: {type: string, required: "iff state signed", notes: 16 lowercase hex — low 64 bits of the OpenPGP fingerprint}
          mechanism: {type: enum, values: [openpgp], required: "iff state signed"}
      encryption:
        type: map
        required: true
        fields:
          state: {type: enum, values: [none, encrypted], required: true}
          parts:
            type: list
            required: "iff state encrypted (non-empty)"
            entry:
              paths: {type: list of absolute in-image paths, required: true}
              algorithm: {type: string, required: true}
              envelope_refs: {type: list of string, required: true, notes: references to externally-held grant envelopes — NEVER keys}
      annotations:
        type: map
        required: false
        notes: free-form k/v; preserved on round-trip
  provides:
    type: kind-specialized map (bound to identity.kind at parse time)
    required: true
    variants:
      app:
        entrypoints:
          type: list
          required: true
          notes: N>=1 — one per invocable command (suites)
          entry:
            name: {type: string, required: true, notes: the command name the shim registers}
            path: {type: string, required: true, notes: absolute in-image path}
            args_default: {type: list of string, required: false}
            runtime_requirement:
              type: map
              required: false
              notes: omit entirely for native / zero-runtime entrypoints (spec 03 §2.2 locked)
              fields:
                engine: {type: string, required: true}
                constraint: {type: string, required: true, notes: "range for pure-language (\">= 3.3, < 5.0\"); abi-line for native-extension (\"~> 3.3.0\")"}
                abi: {type: string, required: false, notes: "the runtime's platform string the native extensions were built against (ruby: Gem::Platform.local.to_s)"}
        platforms: {type: "\"universal\" | list of vcpkg triplets", required: true, notes: "spec 03 §3 axis; aarch64-windows-ucrt reserved"}
        capabilities:
          type: map
          required: true
          notes: "exactly {exec: true, read: true}; may carry host (spec 08 §4 jail request)"
      runtime:
        provides:
          type: "map | list of maps (one-or-many)"
          required: true
          entry:
            engine: {type: string, required: true}
            version: {type: string, required: true}
            abi_line: {type: string, required: true, notes: "the abi line this build satisfies (e.g. \"4.0\")"}
            platform: {type: vcpkg triplet, required: true}
            implementation: {type: string, required: false, notes: "the engine implementation this build is (spec 28 §8 — mri / jruby / truffleruby); the spawn edge's implementation filter"}
        built_from:
          type: map
          required: true
          fields:
            src_sha256: {type: string, required: true, notes: 64 lowercase hex}
            patch_set: {type: string, required: true}
        env: {type: map, required: false, notes: environment defaults the dispatcher composes}
        entrypoints:
          type: list
          required: false
          notes: "the spawn surface (spec 30 §2) — commands this runtime boots for a consumer's runtime-edge expose list; app-entrypoint grammar minus runtime_requirement (a runtime runs on itself)"
          entry:
            name: {type: string, required: true, notes: the command name a consumer's expose list names}
            path: {type: string, required: true, notes: absolute in-image path}
            args_default: {type: list of string, required: false}
        capabilities:
          type: map
          required: true
          notes: "exactly {exec: true, read: true, runtime: true}"
      data:
        mount_semantics:
          type: map
          required: true
          fields:
            suggested: {type: string, required: true, notes: absolute path — SUGGESTED only (the MOUNT RULE gives the decision to the consumer)}
        consumers: {type: list of string, required: false, notes: informational reverse edges}
        capabilities:
          type: map
          required: true
          notes: "exactly {exec: false, read: true}"
      toolkit:
        executables:
          type: list
          required: false
          entry:
            name: {type: string, required: true}
            path: {type: string, required: true, notes: absolute in-image path}
            version: {type: string, required: false}
          notes: native, zero-runtime programs — never a runtime_requirement
        libraries:
          type: list
          required: false
          entry:
            name: {type: string, required: true}
            path: {type: string, required: true}
        platforms: {type: "\"universal\" | list of vcpkg triplets", required: true}
        capabilities:
          type: map
          required: true
          notes: "must carry read: true; may carry host (spec 08 §4)"
        provides_abi:
          type: list
          required: false
          notes: >-
            The spec-18 C11 contract field (feature/toolkit payloads): a C
            ABI name + version at an in-image path. Consumers bind only on
            match, both versions printed on mismatch (named refusal; exit
            code unallocated, spec 18 §7 — 79 is spec 26's CHECK).
          entry:
            name: {type: string, required: true}
            version: {type: string, required: true}
            path: {type: string, required: true, notes: absolute in-image path}
      language:
        notes: no locked v1 shape — preserved losslessly (Provides::Other)
  requires:
    type: list
    required: false
    notes: the MOUNT RULE — mount is declared HERE, in the consumer's manifest
    entry:
      kind: {type: enum, values: [language, toolkit, data, runtime, executable], required: true}
      "language": {engine: "string, required", constraint: "string, required"}
      "toolkit": {name: "string, required", constraint: "string, required", triplets: "list of vcpkg triplets, optional", mount: "absolute path, optional"}
      "data": {name: "string, required", constraint: "string, required", mount: "absolute path, optional"}
      "runtime": {engine: "string, required", implementation: "string, optional", constraint: "string, required", expose: "list of bare command names (no path separator, no drive qualifier; never repeated), optional", notes: "spec 30 §1 (since schema_minor 4) — the spawned-runtime edge: the depended runtime resolves through the RUNTIME index into the store's runtimes/ area and is NEVER co-mounted (NO mount key exists on this edge); its exposed entries are spawned through spec 30 §2's dispatch. The expose x own-entrypoint collision refusal (spec 30 §3) is semantic (the tpkg validator) — not schema-expressible"}
      "executable": {name: "string, required", payload: "string, optional", constraint: "string, required", mount: "absolute path, optional", expose: "list of bare command names (no path separator, no drive qualifier; never repeated), optional", critical: "boolean, optional", notes: "spec 03 §8 + spec 32 §1 (since schema_minor 5) — the capability edge: exact-name resolution against provides.executables ∪ provides.entrypoints[].name (DependencyNotFound / AmbiguousProvider; payload: pins the provider by name). mount and expose are ORTHOGONAL axes: mount opens the VFS surface (co-mount, consumer-declared), expose opens the spawn surface (spec 32 §2 — each exposed name dispatches the provider's own spec-17 dispatch as a child; exposed names never take the exec-tier path). Semantic (the tpkg validator), not schema-expressible: an edge with neither mount nor expose is a named manifest error; name ∈ expose is required; every exposed name must resolve to a runtime-carrying entrypoint of the provider (press/install cross-check, the tebako#494 class); the expose x own-entrypoint collision refusal is spec 30 §3's, extended. Producers mark a functionally required edge critical: true (the evolution law's critical flag)"}
  materialize:
    type: list of absolute in-image paths
    required: false
    since: schema_minor 1
    notes: >-
      spec 22 §4 class R — regular files a C library must read through
      its own IO (the OpenSSL CA cert is the canonical entry). Any kind
      may declare. The driver extracts each declared path P to
      <TEBAKO_EXEC_CACHE>/resources/<image-key>/<P> after the mounts and
      the jail, before the interpreter handoff; the copy is whole-file,
      read-only, and digest-verified (a <P>.tfs-digest record, the
      tfs-merkle-1 file digest). Entries are absolute and carry no '..'
      components (validated at parse). Old readers ignore the key
      (unknown-field rule).
  library_aliases:
    type: list of entries
    required: false
    since: schema_minor 2
    entry:
      name: {type: string, required: true}
      path: {type: absolute in-image path, required: true}
    notes: >-
      spec 22 §2.1 (windows Class L, phase W) — the ONLY bare library
      names that resolve to the image's own files; a bare name matching
      no entry is a HOST reference and passes through untouched
      (host-by-default, no heuristics). `name` is the exact spelling a
      loader call presents: no path separator, no drive qualifier
      (validated at parse); matching is verbatim and case-insensitive,
      never extension-completed. `path` is absolute, carries no '..'
      components, and must name a regular file in the image. Any kind
      may declare; no platform filter (native images are triplet-bound,
      so an alias is platform surface by construction). Old readers
      ignore the key (unknown-field rule).
  checks:
    type: map of check name → check
    required: false
    since: schema_minor 3
    key: "[A-Za-z0-9][A-Za-z0-9._-]* — names surface in report lines and scratch dir names; unique by the map's construction"
    entry:
      entry: {type: "absolute in-image path | the reserved spelling \"self\"", required: false, notes: "PRESENT ⇒ an exec check; ABSENT ⇒ a structural check (MECE — one key decides the shape, never a kind flag). \"self\" is kind-runtime only (spec 26 §1.1: the runtime exe itself, env image mounted)"}
      argv: {type: list of string, required: false, notes: "exec-only. `{scratch}` (the per-run host scratch dir) at most once per entry; every other spelling is literal passthrough — the engine substitutes, the model carries"}
      fixtures: {type: absolute in-image path, required: false, notes: "exec-only. The dir whose CONTENTS land at the HOST scratch root — never VFS-spelled (spec 26 §1)"}
      fixtures_inline: {type: map of fixture name → content, required: false, notes: "COMPOSITION-ONLY (spec 26 §2.1) — a composition document's checks: block speaks this family (a composition has no image); REFUSED in a slice manifest with a named validation error (the fixture families are MECE). Names are non-empty scratch-relative paths (never absolute, no '..' components)"}
      fixtures_host: {type: path relative to the composition file, required: false, notes: "COMPOSITION-ONLY (spec 26 §2.1) — the org repo's checked-in fixture tree, copied to scratch; refused in a slice manifest. Never absolute (either platform family's spellings), no '..' components — validated platform-neutrally"}
      expect:
        type: map
        required: false
        notes: "absent = the default {exit: 0}; byte-golden assertions do not exist by construction"
        fields:
          exit: {type: int, required: false, notes: "default 0"}
          files: {type: list of scratch-relative paths, required: false, notes: "existence + non-empty after the run; never absolute, no '..' components"}
          stdout: {type: string, required: false, notes: "one regex the run's stdout must match; carried uncompiled, the engine compiles it"}
          image_files: {type: list of absolute in-image paths, required: false, notes: "existence + non-empty; the structural check's assertion channel — a structural check requires a non-empty image_files"}
      needs:
        type: list
        required: false
        notes: additive host needs for the check run ONLY (rare) — a minimal mirror of the spec 23 §2 D1 entry grammar
        entry:
          path: {type: string, required: true, notes: absolute host path or a spec 23 §2 symbolic atom}
          access: {type: enum, values: [ro, rw], required: true}
          when: {type: "list of enum [windows, macos, linux]", required: false}
          why: {type: string, required: false}
      requires:
        type: map
        required: false
        notes: "composition prerequisites; unmet ⇒ SKIP (loud, the capability named), never FAIL (spec 26 §2)"
        fields:
          provides: {type: list of string, required: true, notes: non-empty}
      when: {type: "list of enum [windows, macos, linux]", required: false, notes: "the OS-family axis, NOT the spec 03 §3 triplet axis; absent = every platform"}
      timeout: {type: int, required: false, notes: positive seconds; expiry is a FAIL}
    notes: >-
      spec 26 §1 — the payload's own acceptance contracts, declared
      in-image: "given my declared needs, I do my one real thing". Any
      kind may declare checks (exec checks on executable/runtime slices —
      the latter with entry: self — structural checks on data slices).
      A malformed block is a named error at press/`tfs validate` (exit
      65), never discovered at run time (spec 26 §7). Old readers ignore
      the key (unknown-field rule).

refusals:
  - case: identity.schema_version missing
    behavior: era-1 named refusal (never a silent default)
  - case: kind ↔ provides shape mismatch
    behavior: structural error at parse (never a validation surprise later)
  - case: entrypoint's runtime_requirement unsatisfiable at dispatch (S26/C10)
    behavior: named error naming the entrypoint and the requirement — never a segfault
  - case: provides_abi mismatch at bind (C11)
    behavior: named refusal, both versions printed (exit code unallocated — spec 18 §7; 79 is spec 26's CHECK)
  - case: a materialize entry absent from the image, or not a regular file (schema_minor 1)
    behavior: the manifest lies — boot fails with a named error (exit 65), never a skipped entry
  - case: a materialized copy failing digest verification at boot (schema_minor 1)
    behavior: the exec cache is tampered or corrupt — boot fails with a named error (exit 70), never a silently served corruption
  - case: a library_aliases name carrying a path separator or drive qualifier (schema_minor 2)
    behavior: named validation error at parse — the bare-name grammar is exact, never guessed (exit 65)
  - case: a library_aliases path absent from the image, or not a regular file (schema_minor 2)
    behavior: the manifest lies — boot fails with a named error (exit 65), never a skipped entry
  - case: a duplicate alias name within one image, or one alias name declared by two co-mounted images (schema_minor 2)
    behavior: authoring ambiguity — a named error (parse-time, resp. boot-time exit 65), never a silent winner
  - case: "entry: self on a kind other than runtime (schema_minor 3)"
    behavior: named validation error at parse (exit 65) — the reserved spelling names the runtime exe, spec 26 §1.1
  - case: a structural check (no entry) declaring argv/fixtures, or asserting no image_files (schema_minor 3)
    behavior: named validation error at parse (exit 65) — exec-only keys on a structural check are a grammar violation
  - case: a slice manifest declaring fixtures_inline/fixtures_host, or a composition check declaring fixtures (schema_minor 3)
    behavior: named validation error at parse (exit 65) — the fixture families are MECE per context (spec 26 §2.1); a composition check is validated by the engine at document load, a slice check at press/`tfs validate`
  - case: "a duplicate check name within one checks: block (schema_minor 3)"
    behavior: named structural error at parse — an authoring ambiguity, never a silent winner (the map's own deserializer refuses)
  - case: a malformed checks block otherwise (bad name grammar, relative entry, absolute expect.files, '..' components, non-positive timeout, a when value outside windows/macos/linux) (schema_minor 3)
    behavior: named validation error at press/`tfs validate` (exit 65), never discovered at run time (spec 26 §7)
  - case: "a kind: executable edge declaring neither mount: nor expose: (schema_minor 5)"
    behavior: named validation error at parse (exit 65) — a contentless edge opens no surface (spec 32 §1)
  - case: "expose: declared on a kind other than runtime/executable, or an expose-carrying kind: executable edge whose name is absent from the expose list (schema_minor 5)"
    behavior: named validation error at parse (exit 65) — expose lives on spawned edges only, and the depended capability must be surfaced (spec 32 §1)
  - case: "an expose name on a kind: executable edge that does not resolve to a runtime-carrying entrypoint of the resolved provider payload (schema_minor 5)"
    behavior: named validation error at press/install (the tebako#494 cross-check class; a runtime-less match is authoring confusion, never an exec-tier fallback); at spawn, the outruns rule's named spawn error (spec 32 §7)

deprecated: [] # no field is in a deprecation window
