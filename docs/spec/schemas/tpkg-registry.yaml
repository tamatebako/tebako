# =============================================================================
# tpkg-registry.yaml — the developer-hosted registry grammar (spec 18 §2.2,
# C8/C12; spec 04 §2 formalized)
#
# A registry is ANY git host repo carrying tpkg-registry.yaml; the git
# host's releases ARE the storage. The registry MIRRORS only
# resolution-relevant fields (L3) — the dispatcher resolves, and selects
# the host-triplet artifact DECLARATIVELY, without downloading every
# payload.
#
# SSOT: this file owns the grammar; crates/tebako-resolve/src/registry.rs
# (the model of record, one model — parse + validate) mirrors it. `tebako
# publish` validates against it before pushing (C12, producer-side).
# =============================================================================

schema: tpkg-registry
schema_version: 1 # MAJOR — breaking changes only
schema_minor: 0 # MINOR — additive changes only
status: normative
owner: crates/tebako-resolve (the model) in tamatebako/tebako
edge: C8 (loader → registry), C12 (everything → registries)

# The schema evolution law (spec 18 §3) — every schema in this registry
# obeys it; per-schema specializations are noted under `notes:`.
evolution:
  major_minor: >-
    schema_version is a single integer MAJOR; schema_minor an additive
    counter. MAJOR breaks, MINOR adds.
  unknown_fields: >-
    Readers ignore unknown fields within their MAJOR — but never invent
    semantics for them. A field you do not understand changes nothing you do.
  unknown_major: >-
    A named refusal naming the artifact, its schema + version, the consumer
    and its max spoken version, and "upgrade". Exit code per spec 18 §7.
    (S45: newer MAJOR → upgrade refusal.)
  missing_schema_version: >-
    Era 1 — a named refusal ("pre-era document; regenerate with a current
    tool"), never a silent default. (S46: "republish the registry".)
  type_changes: >-
    MAJOR only — no silent coercion (string→list, int→string, kebab→snake).
    Renames ride the deprecation window.
  deprecation_window: >-
    To rename/retype a field inside one MAJOR: writers emit BOTH old and
    new for two consecutive MINOR versions (noted under `deprecated:` with
    the window dates); readers prefer new and warn on old; after two MINORs
    the old field is dropped in the next MINOR.
  critical_flag: >-
    Any container that skips unknown entries supports `critical: true` on
    an entry: a reader that does not understand a critical entry refuses
    with a named error instead of skipping it (spec 18 §3.7).
  lists_stay_lists: >-
    Ordered/multiplicity data is a list of entries carrying their identity
    fields — never keyed maps. (Here: payloads and versions are LISTS;
    entries carry `name:` / `version:`. The per-triplet artifact selection
    is the one sanctioned map — a host-triplet index, not multiplicity
    data.)

declaration:
  where: tpkg-registry.yaml at a git host repo's default-branch root (contents API), as a release artifact, or at a tfs+git path (spec 04 §2 — exactly one location per form)
  format: YAML (authored-manifest rule, invariant 6)

grammar:
  schema_version: {type: int, required: true, notes: this schema's MAJOR (1)}
  payloads:
    type: list
    required: false
    notes: names unique
    entry:
      name: {type: string, required: true, notes: single non-empty path component (a cache key)}
      kind: {type: enum, values: [app, data, toolkit, runtime, language], required: true}
      versions:
        type: list
        required: true
        notes: N>=1; versions unique per payload
        entry:
          version: {type: string, required: true}
          platforms:
            type: "\"universal\" | map(vcpkg triplet → {artifact, sha256})"
            required: true
            notes: >-
              The declarative host-triplet selection (spec 04 §2):
              `universal` for pure-language payloads (one artifact, the
              single-.tfs rule), else the triplet → artifact map. The
              dispatcher reads platforms[host].artifact — never
              adapter-side guessing.
          release:
            type: map
            required: true
            fields:
              ref: {type: string, required: true, notes: "a spec 04 §1 reference (any class)"}
          signature:
            type: map
            required: false
            fields:
              keyid: {type: string, required: true, notes: 16 lowercase hex}
              asc: {type: string, required: true, notes: asset name within the release, or a full reference}
          runtime_requirement:
            type: map
            required: false
            fields:
              engine: {type: string, required: true}
              constraint: {type: string, required: true}
              abi: {type: string, required: false, notes: "the runtime's platform string for native-extension payloads (resolution checks BOTH lines)"}
          entrypoints:
            type: list of string
            required: false
            notes: the command names the payload PROVIDES; each becomes a registered shim at install
      default: {type: string, required: false, notes: the registry-side default version (the version chain's last resort)}

refusals:
  - case: schema_version absent (S46)
    behavior: era-1 refusal — "republish the registry"
  - case: schema_version MAJOR newer than the reader speaks (S45)
    behavior: upgrade refusal (both versions printed)
  - case: entry abi has no host match (S47)
    behavior: filtered; named error when nothing remains
  - case: registry unreachable and the cache older than the 24 h TTL (S48)
    behavior: named error (TEBAKO_OFFLINE=1 = cache-or-named-error)

deprecated: [] # no field is in a deprecation window
