[package]
name = "tebako-pkg"
description = "tebako package (tpkg) trailer surgery: bundle/unbundle/reassemble/insert-image/remove-image/set-runtime/info"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tebako", "tpkg", "package", "cli"]
categories = ["filesystem", "command-line-utilities"]

[dependencies]
tpkg = { version = "0.1.0", path = "../tpkg" }
tebako-json = { version = "0.1.0", path = "../tebako-json" }
tfs = { version = "0.1.0", path = "../tfs" }
tebako-signer = { version = "0.1.0", path = "../tebako-signer" }
rnp = { git = "https://github.com/rnpgp/rnp-rs", rev = "9d459ea36398d9f21b920614aba4816501e2e767", features = ["vendored"] }
libc = "0.2"
sha2 = "0.10"

[dev-dependencies]
tebako-contract-tests = { version = "0.1.0", path = "../../tests/contract" }
tebako-bootstrap = { version = "0.1.0", path = "../tebako-bootstrap" }
tebako-signer = { version = "0.1.0", path = "../tebako-signer" }

[[bin]]
name = "tebako-pkg"
path = "src/main.rs"

[lib]
name = "tebako_pkg"
path = "src/lib.rs"
