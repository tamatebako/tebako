[package]
name = "tebako-pkg"
description = "tebako package (tpkg) trailer surgery: bundle/unbundle/reassemble/insert-image/remove-image/set-runtime/info"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tebako", "tpkg", "package", "cli"]
categories = ["filesystem", "command-line-utilities"]

[dependencies]
tpkg = { version = "2.0.0", path = "../tpkg" }
tebako-json = { version = "2.0.0", path = "../tebako-json" }
tebako-info = { version = "2.0.0", path = "../tebako-info" }
tebako-signer = { version = "2.0.0", path = "../tebako-signer" }
# release-index reads a release's asset space (spec 04 references, service
# adapters). default-features = false drops the git stack (gix/reqwest) —
# this verb only lists release assets; `network` keeps proxy honoring.
tebako-resolve = { version = "2.0.0", path = "../tebako-resolve", default-features = false, features = ["network"] }
rnp = { package = "rnp-rs", version = "0.1.15", features = ["vendored"] }
libc = "0.2"
sha2 = "0.10"

# tfs per-target: the SquashFS backend (squashfs-tools-ng) is
# POSIX/autotools-only — Windows gets a dwarfs-only tfs, the backend
# degrading to a named ENOTSUP (TODO.v2-1/02).
[target.'cfg(not(windows))'.dependencies]
tfs = { version = "2.0.0", path = "../tfs" }

# windows-x64 keeps the dwarfs+limnifs pair; windows-arm64 is
# limnifs-only until dwarfs-t's arm64 closure lands (dwarfs-t #100) —
# a dwarfs read there answers the same named ENOTSUP any compiled-out
# backend gives.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
tfs = { version = "2.0.0", path = "../tfs", default-features = false, features = ["vendored-dwarfs", "backend-limnifs"] }

[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
tfs = { version = "2.0.0", path = "../tfs", default-features = false, features = ["backend-limnifs"] }

[dev-dependencies]
tebako-contract-tests = { version = "2.0.0", path = "../../tests/contract" }
tebako-bootstrap = { version = "2.0.0", path = "../tebako-bootstrap" }
tebako-signer = { version = "2.0.0", path = "../tebako-signer" }
# The canonical file:// URL constructor (three slashes, forward slashes)
# for the release-index fixtures — hand-rolling `file://{path}` is only
# accidentally right on unix.
tebako-http = { version = "2.0.0", path = "../tebako-http" }
# In-process dwarfs-t writer for manifest-carrying image fixtures.
dwarfs-t = { version = "0.1.0", path = "../../../dwarfs-rs/dwarfs" }

[[bin]]
name = "tebako-pkg"
path = "src/main.rs"

[lib]
name = "tebako_pkg"
path = "src/lib.rs"
