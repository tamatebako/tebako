[package]
name = "tebako-cli"
description = "tebako — the packager CLI (lean press): resolve runtime, deploy under it, image, stitch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tebako", "packager", "ruby", "dwarfs", "cli"]
categories = ["command-line-utilities"]

[dependencies]
tpkg = { version = "0.1.0", path = "../tpkg" }
tebako-pkg = { version = "0.1.0", path = "../tebako-pkg" }
tebako-http = { version = "0.1.0", path = "../tebako-http" }
# Registry/payload resolution for `tebako add-registry | install` (spec 04).
tebako-resolve = { version = "0.1.0", path = "../tebako-resolve" }
# Release-API JSON for the publish upload leg (GitHub release documents).
tebako-json = { version = "0.1.0", path = "../tebako-json" }
# The spec-15 introspection model (payload + package inspections, the
# strict verify) — the `tebako inspect` surface renders through it.
tebako-info = { version = "0.1.0", path = "../tebako-info" }
# Config writes (registries:), the manifest mirror and the shim link/unlink
# — called as a library, never spawned (spec 14 §3: no shell-outs).
tebako-shim = { version = "0.1.0", path = "../tebako-shim" }
# OpenPGP verification of signed registry entries (spec 09; strict when the
# entry carries a signature, the v1-legacy warn when it does not).
tebako-signer = { version = "0.1.0", path = "../tebako-signer" }
# The bootstrap's embedded artifact-info block (spec 18 §2.2/S38): the
# `tebako inspect --contract` card reads it through the owner crate — the
# marker grammar has exactly one home.
tebako-bootstrap = { version = "0.1.0", path = "../tebako-bootstrap" }
# (the tfs dependency is per-target, below — squashfs is POSIX-only)
# The suite file (--suite) is authored YAML (spec 00 invariant 6) — the
# tpkg manifest convention (serde_yml), not serde_yaml.
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
# The in-process DwarFS writer (dwarfs-t-rs): the application and deploy
# driver images are built without any mkdwarfs binary.
dwarfs-t = { version = "0.1.0", path = "../../../dwarfs-rs/dwarfs" }
libc = "0.2"
sha2 = "0.10"
# RuntimeSdk provisioning extracts the ruby src release in-process (no tar
# binary): flate2 is already in the tree (miniz_oxide backend, pure Rust);
# tar is its pure-Rust companion (xattr dropped — a src tarball needs none).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
# Hardlink staging area for manifest tree_hash stamping (spec 03 §7).
tempfile = "3"

# The runtime image is extracted in-process through the tfs C ABI
# (item 30b layout seeding); install reads the embedded payload manifest
# (spec 03 §1) through the same ABI. The SquashFS backend
# (squashfs-tools-ng) is POSIX/autotools-only, so Windows gets a
# dwarfs-only tfs — the squashfs backend degrades to a named ENOTSUP
# there (TODO.v2-1/02). The per-target split lives in the consumer (cargo
# features cannot be target-conditional from inside tfs).
[target.'cfg(not(windows))'.dependencies]
tfs = { version = "0.1.0", path = "../tfs" }

[target.'cfg(windows)'.dependencies]
tfs = { version = "0.1.0", path = "../tfs", default-features = false, features = ["vendored-dwarfs"] }
# The runtime/SDK install locks (src/resolve.rs flock port): LockFileEx on
# one byte at offset 0 — the tebako-shim runtime.rs shape. FFI is
# quarantined in that one function.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[[bin]]
name = "tebako"
path = "src/main.rs"

[lib]
name = "tebako_cli"
path = "src/lib.rs"

[dev-dependencies]
# Install fixtures build ZIP images carrying /__tpkg__/manifest.yaml (the
# tfs ZIP backend is pure Rust) — same crate/version as tfs itself.
zip = { version = "2", default-features = false, features = ["deflate"] }
