[package]
name = "tebako-cli"
description = "tebako — the packager CLI (lean press): resolve runtime, deploy under it, image, stitch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tebako", "packager", "ruby", "dwarfs", "cli"]
categories = ["command-line-utilities"]

[dependencies]
tpkg = { version = "0.1.0", path = "../tpkg" }
tebako-pkg = { version = "0.1.0", path = "../tebako-pkg" }
tebako-http = { version = "0.1.0", path = "../tebako-http" }
# The in-process DwarFS writer (dwarfs-t-rs): the application and deploy
# driver images are built without any mkdwarfs binary.
dwarfs-t = { version = "0.1.0", path = "../../../dwarfs-rs/dwarfs" }
libc = "0.2"
sha2 = "0.10"

[[bin]]
name = "tebako"
path = "src/main.rs"

[lib]
name = "tebako_cli"
path = "src/lib.rs"

[dev-dependencies]
