[package]
name = "tfs"
description = "libtfs-rs: the tebako_fs_* C ABI (VFS for embedded archives) in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tebako", "tfs", "vfs", "embedded", "archive"]
categories = ["filesystem", "api-bindings"]

[lib]
# libtfs.{so,dylib,dll} + libtfs.{a,lib} as a drop-in for C++ libtfs,
# plus rlib for in-workspace Rust consumers (tests/contract, future crates).
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
libc = "0.2"
# The stack's one logging facility (TEBAKO_DEBUG; zero cost when off).
tebako-log = { version = "0.1.0", path = "../tebako-log" }
# The `zip` crate (pure Rust) rather than libzip-sys: the C ABI contract is
# behavioral, not library-level; a pure-Rust reader keeps consumers and CI
# free of a native libzip build, and the v1 scope (read-only, no encryption)
# is well inside its feature set. deflate-only keeps the staticlib lean.
zip = { version = "2", default-features = false, features = ["deflate"] }
# The tar backend (read-only): the `tar` crate parses headers (ustar / GNU
# longname / pax, incl. base-256 numeric fields) during the mount-time index
# pass; xattr is extraction-only, so default features stay off.
tar = { version = "0.4", default-features = false }
# gzip-wrapped tar: checkpointed raw-DEFLATE resume (cloned InflateState at
# uncompressed-byte boundaries — the zran pattern, pure Rust). flate2 does
# not expose decompressor-state snapshots, so miniz_oxide is used directly.
miniz_oxide = "0.8"
# zstd-wrapped tar: pure-Rust decoder (no decompressor-state snapshots —
# cold reads re-decode from the stream start; see backends_tar module docs).
ruzstd = "0.7"
# The DwarFS backend binds the EXTERNAL dwarfs-rs crate (path dep until
# dwarfs-rs has a release to pin against; crates.io eventually). It pulls
# the vendored dwarfs-t CMake/vcpkg build into compilation; disable default
# features to stay pure-cargo (the dwarfs backend then returns ENOTSUP).
dwarfs-t = { version = "0.1.0", path = "../../../dwarfs-rs/dwarfs", optional = true }
# libsquashfs (squashfs-tools-ng) via vcpkg for the SquashFS backend.
sqfs-sys = { version = "0.1.0", path = "../sqfs-sys", optional = true }
# The LimniFS backend (spec 20): the pure-Rust limnifs-core reader — no
# system dependencies, `#![forbid(unsafe_code)]` upstream. Path dep until
# limnifs has a release to pin against (same standing as dwarfs-t).
limnifs-core = { git = "https://github.com/limnifs/limnifs", rev = "eddaea404b7686c4f22462c366065a3a35bf9b43", optional = true }
# The ENC stacking transform (spec 10, backends_enc): AES-256-GCM per-block
# confidentiality with HKDF-SHA256 subtree keys, DEK grant envelopes via
# tebako-signer's rnp PKESK wrap/unwrap, mlock'd+zeroized plaintext
# buffers. All pure-Rust RustCrypto crates — no shell-outs anywhere.
tpkg = { version = "0.1.0", path = "../tpkg" }
# The exec probe's tolerant annotation read (exec_materialize): a value
# walk of the in-image manifest — never the validating parse, which
# would fail-closed a newer schema on an older runtime (spec 03's
# compat rule: consumers ignore keys they predate). Same pin as tpkg.
serde_yml = "0.0.12"
tebako-signer = { version = "0.1.0", path = "../tebako-signer", optional = true }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1"
getrandom = "0.2"

[features]
# `vendored-dwarfs` (default): build the dwarfs backend against the vendored
# dwarfs-t sources via dwarfs-rs (requires DWARFS_RS_VCPKG_ROOT).
# `vendored-squashfs` (default): build the SquashFS backend against vcpkg's
# squashfs-tools-ng (requires SQFS_SYS_VCPKG_ROOT, falls back to
# DWARFS_RS_VCPKG_ROOT / VCPKG_ROOT).
# `enc` (default): the ENC confidentiality transform via tebako-signer
# (rnp). Windows (ucrt64) ships WITHOUT it for now — rnp's mingw build is
# unproven (TODO.v2-1/08), so windows consumers take
# default-features = false, features = ["vendored-dwarfs"] and an ENC
# mount fails with named ENOTSUP.
# `backend-limnifs` (default): the LimniFS backend (spec 20) via the
# pure-Rust limnifs-core — the first of the `backend-*` feature family;
# the `vendored-*` features migrate to it as aliases per spec 20 §5.
default = ["vendored-dwarfs", "vendored-squashfs", "enc", "backend-limnifs"]
vendored-dwarfs = ["dep:dwarfs-t"]
vendored-squashfs = ["dep:sqfs-sys"]
enc = ["dep:tebako-signer"]
backend-limnifs = ["dep:limnifs-core"]

[dev-dependencies]
# Tempdir scaffolding for backend tests (large-archive RSS fixtures).
tempfile = "3"
# ENC tests mint recipient key pairs in-memory (same pin as tebako-signer).
rnp = { package = "rnp-rs", version = "=0.1.11", features = ["vendored"] }
# gzip trailer checksums in tar-backend test fixtures.
crc32fast = "1"
# LimniFS golden fixtures are written in-process (never a limni binary) —
# test-only, never linked into the shipped library.
limnifs-write = { git = "https://github.com/limnifs/limnifs", rev = "eddaea404b7686c4f22462c366065a3a35bf9b43" }

