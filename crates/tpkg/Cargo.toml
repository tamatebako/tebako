[package]
name = "tpkg"
description = "The tebako package manifest (tpkg) trailer format — parse, serialize, validate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tebako", "tpkg", "package", "manifest", "trailer"]
categories = ["data-structures", "filesystem", "parser-implementations"]

[dependencies]
# The payload manifest (manifest.rs) is authored YAML: serde + serde_yml
# (owner rule: YAML for all authored manifests, never JSON). The version
# constraint grammar is NOT cargo-semver — spec 03 mixes cargo-style ranges
# (">= 3.3, < 5.0") with ruby-style abi lines ("~> 3.3.0") and datever
# (">= 2024.1"), so manifest.rs carries its own small parse-only grammar.
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
# The payload tree hash (merkle.rs, spec 03 §7): SHA-256 over the
# length-prefixed domain-separated tfs-merkle-1 serialization.
sha2 = "0.10"
# The runtime store's cached release-index mirror (runtime_store.rs,
# spec 05 §3) is MACHINE JSON — the workspace's own minimal parser, no
# serde, no native deps (the authored-YAML rule is untouched).
tebako-json = { version = "2.0.0", path = "../tebako-json" }

[dev-dependencies]
proptest = "1"
# Cross-checks the serde model against schema/tpkg-manifest-v1.schema.json
# (keeps the schema and the Rust model MECE with each other).
jsonschema = "0.30"
# YAML -> JSON value conversion feeding the jsonschema cross-check.
serde_json = "1"
