[package]
name = "tebako-resolve"
description = "MECE payload references (spec 04), transport-agnostic fetchers and the shared payload cache (spec 05)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tebako", "resolve", "reference", "cache", "registry"]
categories = ["data-structures", "filesystem", "parser-implementations"]

[dependencies]
tebako-http = { version = "0.2.0", path = "../tebako-http" }
# Release-API JSON responses are parsed with the workspace's own minimal
# JSON parser — no serde in the release-API stack, no native deps
# (tebako-pkg proper pulls the imaging stack; the parser alone lives in
# tebako-json).
tebako-json = { version = "0.2.0", path = "../tebako-json" }
# The registry model (spec 04 §2) is authored YAML (owner rule): serde +
# serde_yml, the tpkg manifest convention. The Platform/PayloadKind
# vocabulary comes from tpkg itself — the single owner of the triplet ↔
# release-asset-name mapping (spec 03 §3).
tpkg = { version = "0.2.0", path = "../tpkg" }
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
sha2 = "0.10"
libc = "0.2"
# tfs+git: via gitoxide (spec 04 §3) — never the git CLI. Local and
# smart-protocol fetch in-process; reqwest is `rustls-no-provider`, so the
# rustls crate features below select the crypto provider (the process
# default is installed from crate features — the same pattern tebako-http
# uses, commit 8de4335). The provider is platform-split: ring everywhere
# EXCEPT windows-gnu — ring 0.17 has no windows-gnu support (its C fails
# to compile under mingw), so the gnu target rides aws-lc-rs instead (a
# vendored crate exactly like ring; no native-tls, no schannel, no
# behavior change).
gix = { version = "0.86", default-features = false, features = [
    "sha1",
    "blocking-network-client",
    "blocking-http-transport-reqwest",
    "revision",
    "tree-editor",
] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }

[target.'cfg(not(all(windows, target_env = "gnu")))'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[target.'cfg(all(windows, target_env = "gnu"))'.dependencies]
rustls = { version = "0.23", default-features = false, features = [
    "aws_lc_rs",
    "std",
    "tls12",
    "logging",
] }

[lib]
name = "tebako_resolve"
path = "src/lib.rs"

[dev-dependencies]
proptest = "1"
# The git fixtures are built with gix itself — no git CLI anywhere, tests
# included (spec 14 §3).
gix = { version = "0.86", default-features = false, features = ["sha1", "tree-editor"] }

# The per-entry cache flock on Windows (cache.rs — LockFileEx on one byte
# at offset 0, the tebako-bootstrap platform.rs shape). Unix uses libc's
# flock(2); all Win32 FFI is confined to cache.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
