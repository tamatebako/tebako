[package]
name = "tebako-driver"
description = "The spec-17 runtime driver: mounts the env image + payload images for a tebako runtime and rewrites argv to the entrypoint (the Rust successor of the v1 C++ tebako-main)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tebako", "runtime", "driver", "vfs", "tfs"]
categories = ["filesystem"]

[lib]
# libtebako_driver.a for the runtime factories (linked into interpreter
# executables); rlib for in-workspace consumers and tests.
crate-type = ["staticlib", "rlib"]

[dependencies]
# The stack's one logging facility (mount/jail decisions at debug).
tebako-log = { version = "0.3.0", path = "../tebako-log" }
# Trailer probing for `<self|package>:<slot>` resolution (spec 02).
tpkg = { version = "0.3.0", path = "../tpkg" }
# The resolve trace events' detail values (spec 25 §7 blesses tebako-json
# for trace emission; the envelope renderer lives in tfs::trace).
tebako-json = { version = "0.3.0", path = "../tebako-json" }
# The env-image layout declaration (spec 18 C3) is authored YAML.
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
libc = "0.2"
# macOS loader interposition (spec 22 §2 "Phase 1 delivery") content-keys
# the embedded interpose-dylib by its sha256; the exec-cache path-key
# fallback (spec 22 §6, exec_cache.rs) hashes on every platform — sha2
# is unconditional.
sha2 = "0.10"

# The mounts land in the same process-global context the C ABI serves —
# the libtfs-preload pattern (a native Rust consumer of the engine).
# Windows ships dwarfs-only (squashfs-tools-ng is POSIX/autotools-only,
# TODO.v2-1/02; ENC needs rnp's mingw build, TODO.v2-1/08).
[target.'cfg(not(windows))'.dependencies]
tfs = { version = "0.3.0", path = "../tfs" }

[target.'cfg(windows)'.dependencies]
tfs = { version = "0.3.0", path = "../tfs", default-features = false, features = ["vendored-dwarfs", "backend-limnifs"] }

# build.rs compiles the interpose dylib for darwin targets only (its
# TARGET check early-returns elsewhere), but it references the cc crate
# unconditionally — build scripts compile for the HOST, so gating cc on
# cfg(macos) breaks every non-macOS host's compile with E0433. cc stays
# an unconditional build-dependency.
[build-dependencies]
cc = "1"

[dev-dependencies]
# Zip fixtures built in-code (the tests/contract pattern).
zip = { version = "2", default-features = false, features = ["deflate"] }
