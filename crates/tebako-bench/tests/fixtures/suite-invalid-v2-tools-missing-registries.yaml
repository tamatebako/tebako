schema_version: 1
name: v2-tools-missing-registries-suite
workloads:
  - id: author-repress
    kind: press
    source: { kind: vendored, path: benchmarks/fixtures/author-loop/main.rb }
    targets: [v2-tools]
    argv: ["press", "-r", ".", "-e", "main.rb", "-o", "{package}"]
    expect: { exit: 0, files: [] }
    timeout_s: 300
targets:
  - id: v2-tools
    kind: v2-tools
run_policy: { warmup: 1, repetitions: 3, cold_repetitions: 1, interleave: true }
