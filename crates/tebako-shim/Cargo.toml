[package]
name = "tebako-shim"
description = "the tebako dispatcher / version manager (spec 07) — argv0 shim resolution, version chain, runtime resolution, launcher ABI v1 hand-off, shell integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tebako", "shim", "dispatcher", "version-manager"]
categories = ["command-line-utilities"]

[dependencies]
# The unified payload-manifest model (spec 03 — item 40's manifest
# unify): the dispatch mirror is a tpkg::PayloadManifest; constraint
# grammar is tpkg's, the dispatcher only evaluates. tpkg::jail is the
# spec 08 jail model (the mirror's capabilities.host, composed with the
# dispatch flags into TEBAKO_JAIL — the engine stays out of the
# dispatcher).
tpkg = { version = "0.1.0", path = "../tpkg" }
# Remote registry resolution at dispatch time (spec 04 §2 — item 33):
# every registry form (service contents API, pinned release artifact, git
# blob, file) behind the per-ref dispatch cache in src/regcache.rs. The
# shim links tebako-resolve, never tebako-cli.
tebako-resolve = { version = "0.1.0", path = "../tebako-resolve" }
# The authored config / disabled state / project pins are YAML (spec 00
# invariant 6). serde_yaml 0.9 is the cached, pure-Rust (unsafe-libyaml)
# choice — no native build, no async, no clap. (The manifest mirror's
# YAML is parsed by tpkg itself, on serde_yml.)
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# In-process HTTP for runtime downloads (spec 00 invariant 1) — the same
# crate the bootstrap resolves through.
tebako-http = { version = "0.1.0", path = "../tebako-http" }
libc = "0.2"
sha2 = "0.10"

# The Windows shell integration (shell_windows.rs): registry PATH +
# WM_SETTINGCHANGE; the dispatch exec port (dispatch.rs): console Ctrl
# handling. All FFI is quarantined in those two modules.
# (Win32_Security: RegCreateKeyExW's SECURITY_ATTRIBUTES parameter.)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "tebako-shim"
path = "src/main.rs"

[lib]
name = "tebako_shim"
path = "src/lib.rs"
