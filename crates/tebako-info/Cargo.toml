[package]
name = "tebako-info"
description = "The spec-15 info surface: payload/package introspection, verification and JSON documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tebako", "tpkg", "tfs", "info", "introspection"]
categories = ["filesystem", "parser-implementations"]

[dependencies]
tpkg = { version = "0.3.0", path = "../tpkg" }
tebako-json = { version = "0.3.0", path = "../tebako-json" }
tebako-signer = { version = "0.3.0", path = "../tebako-signer" }
sha2 = "0.10"
# errno values for the tree-hash walker's named skip reasons (verify.rs).
libc = "0.2"
# Lenient manifest reads (structure without validate()) for the display
# paths; same pin as tpkg.
serde_yml = "0.0.12"

# tfs per-target: the SquashFS backend (squashfs-tools-ng) is
# POSIX/autotools-only — Windows gets a dwarfs-only tfs, the backend
# degrading to a named ENOTSUP (TODO.v2-1/02).
[target.'cfg(not(windows))'.dependencies]
tfs = { version = "0.3.0", path = "../tfs" }

[target.'cfg(windows)'.dependencies]
tfs = { version = "0.3.0", path = "../tfs", default-features = false, features = ["vendored-dwarfs", "backend-limnifs"] }

[dev-dependencies]
# In-process dwarfs-t writer for manifest-carrying image fixtures.
dwarfs-t = { version = "0.1.0", path = "../../../dwarfs-rs/dwarfs" }

[lib]
name = "tebako_info"
path = "src/lib.rs"
