[package]
name = "libtfs-preload"
description = "libtfs-preload: the preload interposition shim (spec 07 §8 tier 1) — DYLD_INSERT_LIBRARIES / LD_PRELOAD VFS injection for dynamic native binaries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tebako", "tfs", "vfs", "preload", "interposition"]
categories = ["filesystem"]

[lib]
# libtfs_preload.{dylib,so} is the artifact injected into exec'd processes;
# the rlib carries the safe spec/route surface for unit tests and for
# tfs-cli (which reuses the TEBAKO_TFS_MOUNTS parser — one grammar, one
# parser).
name = "tfs_preload"
# staticlib is the EXE shape's delivery (spec 22 §3.6): the runtime exe
# links the family itself when factory link flags allow it, because dyld
# honours __interpose only from a dylib and the exe-shape hole is the
# in-process C library's own reads.
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
# The exe shape (spec 22 §3.6): omit the library CONSTRUCTOR, since a
# statically linked image runs .init_array entries before the host process
# has exported the mount configuration; the driver calls
# `tebako_preload_init` at boot head instead. Default off: the injected
# dylib keeps its constructor.
exe-shape = []

[dependencies]
# The engine, embedded in-process: the shim is a TFS consumer, never a
# format. The pure-cargo backends (zip/tar) cover the fixture cases; the
# vendored dwarfs backend is mandatory in production, and limnifs is the
# ecosystem's DEFAULT image format (spec 20 §6) — a shim that cannot
# mount a payload payload-side (ENOTSUP) is a shim that cannot do its
# job. squashfs stays opt-in via the tfs crate's own features.
tfs = { version = "2.0.0", path = "../tfs", default-features = false, features = ["vendored-dwarfs", "backend-limnifs", "backend-remote"] }
# The lazy mount's range transport (spec 39 §8): the shim rebuilds the
# runtime's mounts in the interpreter's own engine instance, and a
# LAZY_SEEDING env image's groups are fetched on demand from here —
# the same one agent the driver used (never a second client).
tebako-http = { version = "2.0.0", path = "../tebako-http" }
# The slot form of TEBAKO_TFS_MOUNTS (spec 17 §2.1) resolves slot → byte
# region against the tpkg trailer — the wire format's owner crate (pure
# safe Rust, no engine dependency).
tpkg = { version = "2.0.0", path = "../tpkg" }
libc = "0.2"

[dev-dependencies]
# Test-image fixtures (exec proofs mount a zip through the shim).
zip = { version = "9", default-features = false, features = ["deflate"] }
# The in-process DwarFS writer for the fork-exec fixture image (same path
# form as tfs-cli's mkimage): the fork/exec regression needs a backend
# with a worker pool — the zip backend has none and cannot distinguish
# the guard from the bug.
dwarfs-t = { version = "0.1.0", path = "../../../dwarfs-rs/dwarfs" }
# The LAZY_SEEDING fixture image (the lazy re-mount proof) is written
# in-process — never a limni binary (the tfs tests' pattern).
limnifs-write = "0.3.58"
tempfile = "3"
