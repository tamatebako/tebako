[package]
name = "tebako-bootstrap"
description = "the tebako bootstrap launcher in Rust — resolves the runtime (cache/download/payload, SHA256-verified) and execs it with launcher ABI v1"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tebako", "bootstrap", "launcher", "tpkg"]
categories = ["filesystem", "no-std"]

[dependencies]
tpkg = { version = "0.1.0", path = "../tpkg" }
tebako-signer = { version = "0.1.0", path = "../tebako-signer" }
tebako-http = { version = "0.1.0", path = "../tebako-http" }
tebako-term = { version = "0.1.0", path = "../tebako-term" }
rnp = { git = "https://github.com/rnpgp/rnp-rs", rev = "9d459ea36398d9f21b920614aba4816501e2e767" }
libc = "0.2"
sha2 = "0.10"

# The Windows platform layer (LockFileEx / MoveFileExW / SetFileAttributesW
# / SetConsoleCtrlHandler) — the same 0.61 the rest of the workspace
# already resolves transitively; all FFI is confined to src/platform.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
] }

[[bin]]
name = "tebako-bootstrap"
path = "src/main.rs"

[lib]
name = "tebako_bootstrap"
path = "src/lib.rs"

[dev-dependencies]
tebako-signer = { version = "0.1.0", path = "../tebako-signer" }
rnp = { git = "https://github.com/rnpgp/rnp-rs", rev = "9d459ea36398d9f21b920614aba4816501e2e767" }
