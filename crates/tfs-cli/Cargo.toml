[package]
name = "tfs-cli"
description = "tfs — the generic VFS image tool (info/ls/tree/cat/stat/extract/find/mkimage) over libtfs backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tebako", "tfs", "vfs", "cli", "archive"]
categories = ["filesystem", "command-line-utilities"]

[dependencies]
tfs = { version = "0.1.0", path = "../tfs" }
tebako-info = { version = "0.1.0", path = "../tebako-info" }
tebako-json = { version = "0.1.0", path = "../tebako-json" }
# The in-process DwarFS writer for mkimage (dwarfs-t-rs).
dwarfs-t = { version = "0.1.0", path = "../../../dwarfs-rs/dwarfs" }
libc = "0.2"

[[bin]]
name = "tfs"
path = "src/main.rs"

[lib]
name = "tfs_cli"
path = "src/lib.rs"

[dev-dependencies]
tebako-contract-tests = { version = "0.1.0", path = "../../tests/contract" }
# The --verify signature tests mint a press-local key and detached .asc.
tebako-signer = { version = "0.1.0", path = "../tebako-signer" }
rnp = { package = "rnp-rs", version = "0.1.6", features = ["vendored"] }
# Exec-proof image fixtures (zip backend).
zip = { version = "2", default-features = false, features = ["deflate"] }
