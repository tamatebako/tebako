[package]
name = "tebako-contract-tests"
description = "Contract tests: the C++ libtfs c_api cases running through the Rust tebako_fs_* ABI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[target.'cfg(not(windows))'.dependencies]
tfs = { version = "0.1.0", path = "../../crates/tfs" }

# Windows gets the dwarfs-only tfs (the consumer per-target split — the
# SquashFS backend is POSIX/autotools-only and sqfs-sys's build script
# refuses by design; the ENC transform is unproven on mingw).
[target.'cfg(windows)'.dependencies]
tfs = { version = "0.1.0", path = "../../crates/tfs", default-features = false, features = ["vendored-dwarfs"] }

[dependencies]
libc = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
