# The benchmark covenant (spec 27 §11).
#
# A cell is a budget: a metric id the run must produce, the comparison it
# must satisfy, and the bound. A release fails on any `over`; an `absent`
# cell is a coverage gap — reported loudly, never silently satisfied and
# never a false red.
#
# Two cell shapes, each honest about what it measures:
#
# * **Ratio/speedup against the native interpreter on the same host** —
#   the steady-state and filesystem cells. The fib workloads run long
#   enough (fib(37)/fib(40)/fib(47), several native seconds) that the
#   fixed wrapper+mount+boot cost amortizes away and what remains is a
#   property of tebako, not of the runner. A ratio cell on a MICRO
#   workload is a ratio of fixed cost to nothing — the 2026-11-08 dispatch
#   (run 42456544287) measured exactly that: a 29x "first-response ratio"
#   that was 300 ms of boot against an 11 ms native `print(1)`. The
#   per-call costs that do NOT amortize (the mount-routed stat, the
#   in-image decompression on repeated reads) are recorded at their
#   measured worst-leg values with headroom — the covenant trips on
#   REGRESSION, and the website publishes the honest tax, never a fantasy
#   bound that a clean run cannot meet.
# * **Absolute** — the first-response and memory cells, where the budget
#   is a fixed cost the user feels once (a boot) or a fixed resident set
#   (the mount machinery), and a ratio against a tiny native baseline
#   would measure the baseline's smallness, not tebako. Bounds carry
#   headroom over the measured worst leg (cited in each note) so a slow
#   shared runner never trips them — they trip on regressions.
#
# Every cell carries a `source:` (spec 27 §11's covenant arm): the
# workload suffix selectors, the tebako arm's target prefix, the mode, the
# measure (wall | rss), the shape (ratio | speedup | absolute |
# teardown-delta), and the aggregation (worst — the gate is as honest as
# its worst leg). The producer (`tebako-bench report --metrics`) derives
# each sourced cell from the run's dashboard — the gate judges the
# published statistic, never a private recomputation. A cell whose source
# selects nothing in a run (a suite the run did not execute, an arm that
# produced no numbers) answers `absent` — the honest coverage gap.
schema_version: 1
cells:
  # -- first response: the wrapper + mount + boot budget a user feels once.
  # Absolute seconds: the tebako arm's own median, worst leg. Measured
  # worst at the 2026-11-08 dispatch (run 42456544287): 0.98 s warm
  # (macos-arm64, java), 1.10 s cold (same); bounds carry ~2x headroom.
  - id: first-response.cold.median
    bound: 3.0
    comparison: le
    unit: s
    note: time to first output, cold; worst measured leg 1.10 s (run 42456544287)
    source: {workloads: ["-boot"], target: "tebako-", mode: cold, measure: wall, shape: absolute, aggregate: worst}
  - id: first-response.warm.median
    bound: 3.0
    comparison: le
    unit: s
    note: time to first output, warm; measured worst 2.19 s (macos-x86_64 java, run 42525964214 — the Intel leg is the slowest runner class); the bound carries headroom so a slow shared runner never false-trips
    source: {workloads: ["-boot"], target: "tebako-", mode: warm, measure: wall, shape: absolute, aggregate: worst}

  # -- steady state: interposition is per open, not per byte. The fib
  # workloads run seconds on the native arm, so the fixed boot cost is a
  # single-digit share of the tebako arm's total and the speedup measures
  # the compute path.
  - id: steady.cpu.throughput
    bound: 0.80
    comparison: ge
    unit: ratio-to-native
    note: a CPU-bound workload must keep at least this share of native throughput; measured worst 0.84 (macos-arm64 python, run 42525964214) on the healthy matrix — the defective python/macos-x86_64 pair (tebako-runtime-python#79) is a declared gap, never averaged in
    source: {workloads: ["-fib"], target: "tebako-", mode: warm, measure: wall, shape: speedup, aggregate: worst}
  - id: steady.io.throughput
    bound: 0.20
    comparison: ge
    unit: ratio-to-native
    note: the in-image sequential read pays the dwarfs decompression path per pass; measured worst 0.30 (gnu-x86_64 ruby, run 42525964214 — 0.87 s native vs 2.87 s in-image over 128 passes of the 64 MiB fixture) — the bound trips on regression below the measured tax, the tax is published, not hidden
    source: {workloads: ["-ioread"], target: "tebako-", mode: warm, measure: wall, shape: speedup, aggregate: worst}

  # -- filesystem: the mount-routed per-call tax lives here and nowhere
  # else. The statloop walks the runtime's own tree (in-image for the
  # tebako arm): every stat crosses the mount router. The measured tax is
  # per-call, so no walk length amortizes it — the bound records the
  # measured worst leg with headroom (the covenant trips on REGRESSION,
  # never on the architecture's honest cost). The .max/.median pair was
  # one statistic with two bounds (the producer reads the median wall for
  # both) — folded 2026-11-08 per §11.1's no-duplicate rule.
  - id: filesystem.stat.median
    bound: 26.0
    comparison: le
    unit: ratio-to-native
    note: stat through the mount router, the median of a repeated tree walk; measured worst 21.1 (musl-x86_64 ruby, run 43697407682, fleet ubuntu24/20261111.127 — the label's .370→.127 fleet move doubled the leg's ratio with BOTH arms shifting, tebako#1067; pre-move worst 12.4 on .370, run 42521298313)
    source: {workloads: ["-statloop"], target: "tebako-", mode: warm, measure: wall, shape: ratio, aggregate: worst}

  # -- memory: the mount machinery is a fixed resident cost; the budget is
  # the absolute peak any leg shows. Measured worst 470 MB
  # (windows-ucrt64, tebako-java, run 42456544287); the bound is 640 MiB.
  - id: memory.rss.peak
    bound: 671088640
    comparison: le
    unit: bytes
    note: resident-set peak at steady state, worst leg; worst measured 470 MB (run 42456544287)
    source: {workloads: ["-boot", "-fib", "-ioread", "-statloop"], target: "tebako-", mode: warm, measure: rss, shape: absolute, aggregate: worst}

  # -- teardown and lifecycle. exit_seconds rides the boot cells'
  # first-output medians: the wall median minus the first-output median
  # on the SAME cell is the exit tail a finished dispatch shows (the
  # sampler stamps the child's first write; spec 27 §11.1's
  # teardown-delta shape, 2026-11-21). materialize_vs_extract divides
  # the ruby spawn-edge leg (an in-image `gem --version` with the host
  # PATH pinned away, so resolution can only succeed inside the runtime
  # image) by the whole-image extraction of the SAME runtime ref — v2's
  # pay-at-mount against v1's unpack-everything. Ruby only: java's
  # runtime home materializes the whole tree per boot (the ratio would
  # red by construction) and python's image ships no in-image
  # executables to spawn (spec 27 §10.6).
  - id: teardown.exit_seconds
    bound: 0.5
    comparison: le
    unit: s
    note: exit latency of a finished dispatch — median wall minus median first-output on the boot legs
    source: {workloads: ["-boot"], target: "tebako-", mode: warm, measure: wall, shape: teardown-delta, aggregate: worst}
  - id: teardown.materialize_vs_extract
    bound: 1.0
    comparison: le
    unit: ratio
    note: exec-cache materialization must never be slower than whole-image extraction; measured 0.73 on macos-arm64 (0.29 s spawn vs 0.40 s extract, 2026-11-21 walkthrough)
    source: {workloads: ["-spawn"], target: "tebako-", baseline: "extract-", mode: warm, measure: wall, shape: ratio, aggregate: worst}

  # -- the author loop: the two numbers the walkthrough publishes, now
  # produced by the metanorma suite's v2-tools arm (spec 27 §11.1). The
  # priming press at acquisition downloads the runtime; the re-press
  # workload measures `tebako press` of the unchanged vendored project
  # per run; the first-run workload boots the primed package. Both are
  # warm-store semantics (the arm's cold cell is a named gap — a cold
  # press would re-resolve the runtime inside the measured span). The
  # bounds predate the first fleet numbers (the 2026-11-21 walkthrough
  # measured 7.93 s re-press / 2.73 s first run on a shared macos-arm64
  # machine) — the first dispatch calibrates them.
  - id: author-loop.repress.median
    bound: 6.0
    comparison: le
    unit: s
    note: median of five re-presses of an unchanged project; bound pending fleet calibration (walkthrough measured 7.93 s on a shared machine)
    source: {workloads: ["-repress"], target: "v2-tools", mode: warm, measure: wall, shape: absolute, aggregate: worst}
  - id: author-loop.first_run.median
    bound: 2.5
    comparison: le
    unit: s
    note: median of five first executions of a pressed package, warm store; bound pending fleet calibration (walkthrough measured 2.73 s)
    source: {workloads: ["-first-run"], target: "v2-tools", mode: warm, measure: wall, shape: absolute, aggregate: worst}
